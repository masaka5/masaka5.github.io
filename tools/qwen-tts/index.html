<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fa"><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="studio.css?v=20261114-qwen1"><script type="module" src="studio.js?v=20261114-qwen1"></script><title>语音工作室 · 口袋工具箱</title><meta name="description" content="Qwen3-TTS 1.7B 本地语音工作室：官方音色、声音设计、音色克隆和十种语言，支持流式试听、长文本与音频下载。"><link rel="canonical" href="https://tools.manshii.asia/tools/qwen-tts/"></head>
<body><script src="../../assets/usage.js"></script><div class="studio-shell">
<header class="studio-header"><a href="../../" class="back-button" aria-label="返回工具箱">‹</a><h1>语音工作室</h1><span class="model-badge">Qwen3-TTS · 1.7B Q4</span><button id="loadModel" class="primary" type="button">加载模型</button><button id="cancelLoad" class="secondary" type="button" hidden>取消</button></header>
<div class="model-bar"><span id="modelState" role="status">模型未加载</span><span id="modelDetail">所选模式约 1.5 GB · 浏览器缓存</span><button id="clearModel" class="text-button" type="button">清除缓存</button><progress id="modelProgress" max="1" value="0" hidden></progress></div>
<nav class="mobile-tabs" aria-label="工作区"><button data-pane="compose" aria-selected="true">生成</button><button data-pane="config" aria-selected="false">配置</button><button data-pane="history" aria-selected="false">记录 <span id="mobileCount"></span></button></nav>
<main class="studio-main" data-pane="compose">
<section class="studio-panel config-panel" aria-label="语音配置"><div class="panel-heading"><h2>语音配置</h2><button id="resetConfig" class="text-button" type="button">重置</button></div><div class="panel-content">
<div class="config-row"><label class="field"><span>生成模式</span><select id="mode"><option value="customvoice">预设音色</option><option value="voicedesign">声音设计</option><option value="base">音色克隆</option></select></label><label class="field"><span>模型</span><select id="quality"><option value="standard">标准 · 1.7B</option><option value="lite">轻量 · 0.6B</option></select></label></div>
<div class="config-row"><label class="field"><span>语言</span><select id="language"></select></label><label class="field" id="speakerField"><span>官方音色</span><select id="speaker"></select></label></div>
<label class="field" id="instructionField"><span id="instructionLabel">风格指令（可选）</span><textarea id="instruction" rows="3" placeholder="例如：温柔自然，语速稍慢"></textarea></label>
<div id="referenceFields" hidden><label class="field"><span>参考音频</span><label class="file-button" for="reference"><span id="referenceName">选择音频</span><span>＋</span></label><input id="reference" type="file" accept="audio/*" hidden></label><audio id="referencePreview" controls preload="metadata" hidden></audio><label class="check-row"><input id="xVectorOnly" type="checkbox">仅提取音色</label><label class="field" id="refTextField"><span>参考音频文字</span><textarea id="refText" rows="3" placeholder="填写音频中的原话"></textarea></label><p class="reference-note">参考音频建议 3–20 秒。</p></div>
<details id="advanced"><summary>高级参数</summary><div class="advanced-fields"><label class="field"><span>随机种子</span><input id="seed" type="number" min="0" max="2147483647" step="1" value="42"></label><label class="field"><span>每段最大帧数</span><input id="tokens" type="number" min="16" max="768" step="1" value="512"></label><label class="field"><span>温度</span><input id="temperature" type="number" min="0" max="2" step="0.05" value="0.9"></label><label class="field"><span>Top K</span><input id="topK" type="number" min="0" max="2048" step="1" value="50"></label><label class="field"><span>Top P</span><input id="topP" type="number" min="0.01" max="1" step="0.01" value="1"></label><label class="field"><span>重复惩罚</span><input id="repetition" type="number" min="1" max="2" step="0.01" value="1.05"></label><label class="field"><span>声学温度</span><input id="subTemperature" type="number" min="0" max="2" step="0.05" value="0.9"></label><label class="field"><span>声学 Top K</span><input id="subTopK" type="number" min="0" max="2048" step="1" value="50"></label><label class="field"><span>声学 Top P</span><input id="subTopP" type="number" min="0.01" max="1" step="0.01" value="1"></label></div></details>
</div></section>
<section class="studio-panel compose-panel" aria-label="生成语音"><div class="panel-heading"><h2>朗读文本</h2><span id="charCount">0 字</span></div><textarea id="text" placeholder="输入要朗读的文字…" aria-label="朗读文本" spellcheck="false"></textarea><div class="compose-footer"><label class="check-row"><input id="livePreview" type="checkbox" checked>流式试听</label><span id="generateStatus" role="status"></span><div class="compose-buttons"><button id="generate" class="primary" disabled>生成语音</button><button id="stop" class="secondary" hidden>停止</button></div></div></section>
<section class="studio-panel history-panel" aria-label="生成记录"><div class="panel-heading"><h2>生成记录 <span id="recordCount">0</span></h2><button id="clearHistory" class="text-button" type="button">清空</button></div><div id="generationList" class="generation-list"><div id="historyEmpty" class="empty-history"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg><span>生成的音频将显示在这里</span></div></div></section>
</main><footer><span id="pageStatus" role="status"></span><span class="shortcut-hint">Ctrl / ⌘ + Enter 生成</span></footer></div></body></html>
