<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>串口调试 · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="serial.css"></head><body><div class="serial-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>串口调试</h1><button id="settingsToggle" class="text-button" aria-expanded="false">连接设置</button></header><main><aside id="settings"><div class="panel-head"><h2>连接</h2><span id="deviceInfo">未连接</span></div><label class="field"><span>波特率</span><input id="baudRate" type="number" min="50" max="4000000" value="115200" list="baudRates"><datalist id="baudRates"><option value="9600"><option value="19200"><option value="38400"><option value="57600"><option value="115200"><option value="460800"><option value="921600"></datalist></label><div class="row"><label class="field"><span>数据位</span><select id="dataBits"><option>8</option><option>7</option></select></label><label class="field"><span>停止位</span><select id="stopBits"><option>1</option><option>2</option></select></label></div><div class="row"><label class="field"><span>校验</span><select id="parity"><option value="none">无</option><option value="even">偶校验</option><option value="odd">奇校验</option></select></label><label class="field"><span>流控</span><select id="flowControl"><option value="none">无</option><option value="hardware">硬件</option></select></label></div><button id="connect" class="primary">选择并连接</button><button id="disconnect" class="secondary" disabled>断开</button><p id="connectionStatus" class="status" role="status"></p><div class="aside-bottom"><span id="counts">接收 0 B · 发送 0 B</span><button id="resetCounts" class="text-button">重置</button></div></aside><section class="workspace"><nav class="network-tabs"><button data-tab="monitor" aria-pressed="true">串口监视</button><button data-tab="firmware" aria-pressed="false">固件烧录</button></nav><section id="monitor" class="tab-panel"><div class="log-toolbar"><div class="actions"><label><input id="receiveHex" type="checkbox"> HEX</label><label><input id="timestamps" type="checkbox"> 时间</label><label><input id="follow" type="checkbox" checked> 跟随</label></div><div class="actions"><button id="pause" class="text-button" aria-pressed="false">暂停</button><button id="clear" class="text-button">清空</button><button id="export" class="text-button">导出</button></div></div><pre id="log" tabindex="0" aria-label="串口接收日志"></pre><form id="sendForm"><textarea id="payload" placeholder="输入发送内容" aria-label="发送内容" spellcheck="false"></textarea><div class="send-options"><label class="sr-only" for="sendMode">发送格式</label><select id="sendMode"><option value="text">文本 UTF-8</option><option value="hex">HEX</option></select><label class="sr-only" for="lineEnding">行尾</label><select id="lineEnding"><option value="none">无行尾</option><option value="lf">LF</option><option value="crlf">CRLF</option><option value="cr">CR</option></select><label class="interval-label"><input id="periodic" type="checkbox"> 定时</label><input id="interval" type="number" min="100" max="3600000" value="1000" aria-label="定时间隔毫秒"><span>ms</span><button id="send" type="submit" class="primary" disabled>发送</button></div><p id="sendStatus" class="status" role="status"></p></form></section><section id="firmware" class="tab-panel" hidden><div class="flash-settings"><div class="panel-head"><h2>ESP 固件</h2><span>ESP32 / ESP8266</span></div><div class="row"><label class="field"><span>烧录波特率</span><select id="flashBaud"><option>115200</option><option>460800</option><option>921600</option></select></label><label class="field"><span>Flash 容量</span><select id="flashSize"><option value="detect">自动识别</option><option>1MB</option><option>2MB</option><option>4MB</option><option>8MB</option><option>16MB</option><option>32MB</option></select></label></div><div id="firmwareFiles"></div><div class="actions"><button id="addFirmware" class="secondary">添加固件</button><button id="flash" class="primary">连接并烧录</button></div><p class="status">支持 BIN 多地址写入。仅擦除写入覆盖的扇区，请按固件说明填写地址。</p><progress id="flashProgress" max="100" value="0" aria-label="烧录进度"></progress><p id="flashStatus" class="status" role="status"></p></div><pre id="flashLog" tabindex="0" aria-label="烧录日志"></pre></section></section></main><footer class="ops-footer"><span id="support">Web Serial</span><span id="state">未连接</span></footer></div><dialog id="flashConfirm"><form method="dialog"><h2>确认烧录</h2><p id="flashSummary"></p><p>将写入设备并重置，请确认固件和地址正确。</p><div class="actions"><button value="cancel" class="secondary">取消</button><button value="confirm" class="primary">开始烧录</button></div></form></dialog><script type="module" src="serial.js"></script></body></html>
