<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>直播工作台 · 工具箱</title><meta name="description" content="浏览器场景合成、音视频混音、直播推流与本地录制。"><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="style.css"><script defer src="../../assets/tool-icon-paths.js"></script><script defer src="../../assets/tool-icons.js"></script><script type="module" src="app.js"></script></head>
<body><div class="broadcast-shell" id="shell" data-panel="sources">
 <header class="topbar"><div class="brand"><a href="../../" class="back-link">← 工具箱</a><h1>直播工作台</h1></div><div class="top-actions"><span id="sessionState" class="session-state">未推流</span><button id="openOutput" class="secondary compact">画质</button><button id="openLibrary" class="secondary compact">录像</button><button id="openProject" class="icon-button" title="工程" aria-label="工程文件" data-icon="folder-open"></button></div></header>
 <main class="studio"><section class="preview-panel"><div class="preview-heading"><div><span class="preview-dot"></span><strong id="sceneTitle">场景 1</strong></div><div class="preview-tools"><button class="icon-button" id="fitSource" title="素材适配画布" aria-label="素材适配画布" data-icon="maximize"></button><button class="icon-button" id="toggleGuides" aria-pressed="true" title="显示选区" aria-label="显示选区" data-icon="scan"></button><button class="icon-button" id="fullscreenPreview" title="全屏预览" aria-label="全屏预览" data-icon="expand"></button></div></div><div class="preview-area" id="previewArea"><div class="canvas-wrap" id="canvasWrap"><canvas id="outputCanvas" width="1280" height="720" aria-label="直播画面"></canvas><div class="selection-overlay" id="selectionOverlay"><div class="source-outline" id="sourceOutline" hidden><button class="transform-handle" data-handle="resize" aria-label="缩放素材"></button><button class="rotate-handle" data-handle="rotate" aria-label="旋转素材"></button></div></div><div class="canvas-empty" id="canvasEmpty"><span data-icon="clapperboard"></span><span>添加素材开始</span><button class="secondary" id="addFromEmpty">添加素材</button></div></div></div><div class="preview-foot"><span id="outputLabel">1280 × 720</span><span id="previewFPS">0 fps</span><span class="preview-record" id="recordBadge" hidden>● 录制中 <b id="recordTime">00:00</b></span><span id="previewSelected">未选中素材</span></div></section>
 <nav class="mobile-tabs" aria-label="工作区"><button data-panel-tab="scenes">场景</button><button data-panel-tab="sources" aria-pressed="true">素材</button><button data-panel-tab="audio">声音</button><button data-panel-tab="properties">属性</button></nav>
 <section class="dock-panel scenes-panel" data-work-panel="scenes"><div class="dock-heading"><h2>场景</h2><div><button class="icon-button" id="newScene" aria-label="新建场景" title="新建场景" data-icon="plus"></button><button class="icon-button" id="deleteScene" aria-label="删除场景" title="删除场景" data-icon="trash-2"></button></div></div><div id="sceneList" class="item-list" aria-label="场景列表"></div><div class="list-foot"><span id="sceneCount">1 个场景</span><div><button class="mini-button" id="scenePrev" aria-label="上一页场景">‹</button><button class="mini-button" id="sceneNext" aria-label="下一页场景">›</button></div></div></section>
 <section class="dock-panel sources-panel" data-work-panel="sources"><div class="dock-heading"><h2>素材</h2><div><button class="icon-button" id="addSource" aria-label="添加素材" title="添加素材" data-icon="plus"></button><button class="icon-button" id="sourceUp" aria-label="上移图层" title="上移图层" data-icon="arrow-up"></button><button class="icon-button" id="sourceDown" aria-label="下移图层" title="下移图层" data-icon="arrow-down"></button><button class="icon-button" id="removeSource" aria-label="删除素材" title="删除素材" data-icon="trash-2"></button></div></div><div id="sourceList" class="item-list" aria-label="素材列表"></div><div class="list-foot"><span id="sourceCount">0 个素材</span><div><button class="mini-button" id="sourcePrev" aria-label="上一页素材">‹</button><button class="mini-button" id="sourceNext" aria-label="下一页素材">›</button></div></div></section>
 <section class="dock-panel audio-panel" data-work-panel="audio"><div class="dock-heading"><h2>混音</h2><button class="icon-button" id="addMicrophone" aria-label="添加麦克风" title="添加麦克风" data-icon="mic"></button></div><div id="audioList" class="item-list audio-list"></div><div class="list-foot"><span id="audioState">麦克风与系统声音</span><div><button class="mini-button" id="audioPrev" aria-label="上一页音轨">‹</button><button class="mini-button" id="audioNext" aria-label="下一页音轨">›</button></div></div></section>
 <aside class="dock-panel properties-panel" data-work-panel="properties"><div class="dock-heading"><h2>素材属性</h2><span id="propertyType"></span></div><div id="noSelection" class="panel-empty">选择素材进行编辑</div><div id="sourceProperties" class="property-content" hidden><nav class="property-tabs"><button data-property-tab="basic" aria-pressed="true">布局</button><button data-property-tab="content">内容</button><button data-property-tab="effects">效果</button></nav><div data-property-pane="basic" class="property-pane"><label class="field"><span>名称</span><input id="sourceName" maxlength="60"></label><div class="field-grid"><label class="field"><span>X</span><input id="sourceX" type="number" step="1"></label><label class="field"><span>Y</span><input id="sourceY" type="number" step="1"></label><label class="field"><span>宽度</span><input id="sourceWidth" type="number" min="1" step="1"></label><label class="field"><span>高度</span><input id="sourceHeight" type="number" min="1" step="1"></label><label class="field"><span>旋转 °</span><input id="sourceRotation" type="number" min="-360" max="360"></label><label class="field"><span>透明度 %</span><input id="sourceOpacity" type="number" min="0" max="100"></label></div><div class="property-buttons"><button class="secondary compact" id="centerSource">居中</button><button class="secondary compact" id="resetTransform">重置布局</button></div></div><div data-property-pane="content" class="property-pane" hidden><label class="field" id="textField"><span>文字</span><textarea id="sourceText" maxlength="2000" rows="3"></textarea></label><div id="textOptions" class="field-grid"><label class="field"><span>字号</span><input id="sourceFontSize" type="number" min="8" max="240"></label><label class="field"><span>颜色</span><input id="sourceColor" type="color" value="#ffffff"></label></div><label class="field" id="countdownField"><span>倒计时（秒）</span><input id="sourceCountdown" type="number" min="0" max="86400"></label><button class="secondary" id="restartCountdown">重新倒计时</button><button class="secondary" id="reconnectSource">重新采集</button><div class="property-buttons" id="videoControls"><button class="secondary" id="toggleVideo">播放 / 暂停</button><label class="check-label"><input type="checkbox" id="sourceLoop">循环</label></div><p class="small-note" id="contentNote"></p></div><div data-property-pane="effects" class="property-pane" hidden><label class="field" id="scrollField"><span>滚动字幕（像素/秒）</span><input id="sourceScroll" type="number" min="0" max="500"></label><label class="check-label"><input type="checkbox" id="sourceChroma">绿幕抠像</label><div class="field-grid"><label class="field"><span>背景色</span><input id="sourceChromaColor" type="color" value="#00ff00"></label><label class="field"><span>容差</span><input id="sourceTolerance" type="range" min="0.01" max="0.8" step="0.01" value="0.25"></label></div><p class="small-note">图片素材可直接作为水印叠放。</p></div></div></aside>
 </main><footer class="controlbar"><div class="status-line"><span id="notice" role="status">就绪</span><span id="liveMetrics" class="mono"></span></div><div class="broadcast-actions"><button class="secondary" id="toggleRecording"><span class="record-dot"></span><span id="recordButtonLabel">开始录制</span></button><button class="primary" id="openStream"><span data-icon="radio"></span><span id="streamButtonLabel">开始直播</span></button></div></footer>
</div>
<dialog id="sourceDialog"><div class="dialog-head"><h2>添加素材</h2><button class="icon-button" data-close aria-label="关闭" data-icon="x"></button></div><div class="source-picker"><button id="addCamera" data-source-type="camera"><span data-icon="video"></span>摄像头</button><button id="addScreen" data-source-type="screen"><span data-icon="screen-share"></span>屏幕</button><button id="addWindow" data-source-type="window"><span data-icon="app-window"></span>窗口</button><button id="addImage" data-source-type="image"><span data-icon="image"></span>图片 / 水印</button><button id="addVideo" data-source-type="video"><span data-icon="film"></span>视频</button><button id="addText" data-source-type="text"><span data-icon="type"></span>文字 / 字幕</button><button id="addCountdown" data-source-type="countdown"><span data-icon="timer"></span>倒计时</button><button id="addMic" data-source-type="microphone"><span data-icon="mic"></span>麦克风</button></div></dialog>
<dialog id="outputDialog"><div class="dialog-head"><h2>画质设置</h2><button class="icon-button" data-close aria-label="关闭" data-icon="x"></button></div><form id="outputForm" class="dialog-content"><label class="field"><span>分辨率</span><select id="outputSize"><option value="1280x720">1280 × 720</option><option value="1920x1080">1920 × 1080</option><option value="854x480">854 × 480</option><option value="720x1280">720 × 1280</option><option value="1080x1920">1080 × 1920</option></select></label><div class="field-grid"><label class="field"><span>帧率</span><select id="outputFPS"><option>15</option><option>24</option><option>25</option><option selected>30</option><option>60</option></select></label><label class="field"><span>目标码率（kbps）</span><input id="outputBitrate" type="number" min="500" max="20000" step="100" value="4500"></label></div><button class="primary" type="submit">应用</button></form></dialog>
<dialog id="streamDialog"><div class="dialog-head"><h2>推流设置</h2><button class="icon-button" data-close aria-label="关闭" data-icon="x"></button></div><form id="streamForm" class="dialog-content"><label class="field"><span>方式</span><select id="streamMode"><option value="whip">WHIP / WebRTC</option><option value="rtmp">RTMP 转发</option></select></label><div id="whipFields"><label class="field"><span>WHIP 地址</span><input id="whipEndpoint" type="url" placeholder="https://live.example.com/live/whip" spellcheck="false"></label><label class="field"><span>Token（可选）</span><input id="whipToken" type="password" autocomplete="off"></label></div><div id="rtmpFields" hidden><label class="field"><span>转发网关</span><input id="relayURL" type="url" placeholder="wss://relay.example.com" spellcheck="false"></label><label class="field"><span>RTMP 地址</span><input id="rtmpAddress" placeholder="rtmp://live.example.com/live" spellcheck="false"></label><label class="field"><span>Stream Key</span><input id="rtmpKey" type="password" autocomplete="off"></label><p class="small-note">需已有 api.video-compatible 转发网关；密钥仅本次使用。</p></div><p id="streamError" class="status" role="status"></p><div class="property-buttons"><button type="button" id="cancelStreaming" class="secondary">取消</button><button type="submit" id="startStreaming" class="primary">连接并推流</button></div></form></dialog>
<dialog id="libraryDialog" class="library-dialog"><div class="dialog-head"><h2>录像</h2><button class="icon-button" data-close aria-label="关闭" data-icon="x"></button></div><div class="dialog-content"><video id="recordPreview" controls playsinline hidden></video><div id="recordingsList" class="recordings-list"></div><div class="list-foot"><span id="recordingCount"></span><div><button class="mini-button" id="recordPrev" aria-label="上一页录像">‹</button><button class="mini-button" id="recordNext" aria-label="下一页录像">›</button></div></div></div></dialog>
<dialog id="projectDialog"><div class="dialog-head"><h2>工程</h2><button class="icon-button" data-close aria-label="关闭" data-icon="x"></button></div><div class="dialog-content"><button id="exportRecovery" class="secondary" hidden>导出原草稿</button><button id="exportProject" class="secondary">导出工程</button><button id="importProject" class="secondary">导入工程</button><button id="resetProject" class="secondary">新建空白工程</button><p class="small-note">场景与素材自动保存在当前浏览器，工程文件包含本地素材。</p></div></dialog>
<input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden><input type="file" id="videoFile" accept="video/*" hidden><input type="file" id="projectFile" accept=".json" hidden></body></html>
