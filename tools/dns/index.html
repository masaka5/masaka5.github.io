<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS 查询 · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="../../assets/studio.css"><script defer src="../../assets/ops-ui.js"></script><script defer src="../../assets/dns-core.js"></script><script defer src="dns.js"></script></head><body><div class="studio-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>DNS 查询</h1><a class="header-action" href="../ip-location/">IP 位置查询 →</a></header><main class="studio-main"><aside class="studio-controls"><h2>解析对比</h2><label class="field"><span>域名（PTR 可输入 IP）</span><input id="dnsName" value="tools.manshii.asia" autocomplete="off" maxlength="253"></label><label class="field"><span>记录类型</span><select id="dnsType"><option>A</option><option>AAAA</option><option>CNAME</option><option>MX</option><option>TXT</option><option>NS</option><option>SOA</option><option>PTR</option><option>CAA</option><option>SRV</option><option>HTTPS</option></select></label><div class="panel-head"><h2>公共 DNS</h2><button id="selectDNS" class="text-button">全选</button></div><div id="dnsProviders" class="provider-list"></div><label class="field"><span>自定义 DoH 地址（可选）</span><input id="customDNS" placeholder="https://…/dns-query" type="url"></label><div class="actions"><button id="queryDNS" class="primary">查询</button><button id="stopDNS" class="secondary" disabled>停止</button><button id="exportDNS" class="text-button" disabled>导出</button></div><p class="status" id="dnsStatus" role="status"></p><p class="help">浏览器直连 DoH，显示当前网络视角。服务可能限制跨域或所在地区；失败会保留原因。传统 UDP DNS 无法在网页直接查询。</p></aside><section class="studio-stage"><div class="panel-head"><h2>解析结果</h2><button id="dnsReference" class="text-button">常见 DNS 地址</button></div><div id="dnsResults" class="lookup-results"><p class="empty">选择解析器后开始查询</p></div></section></main><footer class="studio-footer"><span>TTL 为秒 · 耗时为 HTTPS 请求耗时</span><span>相同域名可能因缓存与地域返回不同结果</span></footer></div><dialog id="dnsReferenceDialog"><div class="panel-head"><h2 style="font-size:16px">常见 DNS 地址</h2><button id="closeDNSReference" class="text-button">关闭</button></div><div id="dnsReferenceList" style="margin-top:16px"></div><p class="inline-note" style="margin-top:14px">此表为配置参考。未提供公共 DoH 或不允许跨域的服务无法在网页直连查询。</p></dialog></body></html>
