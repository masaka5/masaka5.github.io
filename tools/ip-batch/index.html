<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>IP 批量整理 · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"/><link rel="stylesheet" href="../../assets/ops.css"/><script defer src="../../assets/net-core.js"></script><script defer src="../../assets/ops-ui.js"></script><script defer src="../../assets/ops-tools.js"></script></head>
<body data-tool="ip-batch" data-view="input"><div class="ops-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>IP 批量整理</h1><span></span></header><main class="ops-main"><nav class="workspace-tabs" aria-label="工具视图"><button data-view-target="input" aria-pressed="true">输入</button><button data-view-target="result" aria-pressed="false">结果</button></nav><div class="ops-workspace"><section class="ops-panel" data-pane="input"><label class="field"><span>处理方式</span><select id="batchMode"><option value="sort">去重并排序</option><option value="merge">合并为最少 CIDR 网段</option></select></label><label class="field grow"><span>每行一个 IP、CIDR 或地址范围</span><textarea id="inputValue" spellcheck="false" placeholder="192.168.1.1&#10;192.168.1.0/25&#10;192.168.1.128/25&#10;2001:db8::/64"></textarea></label><div class="actions"><button class="primary" id="processBatch">整理</button><button class="secondary" id="batchExample">填入示例</button></div><p id="toolStatus" class="status" role="status"></p></section><section class="ops-panel" data-pane="result"><div class="panel-head"><h2>整理结果</h2><span id="resultCount">0 项</span></div><label class="field grow"><span class="mono">IPv4 / IPv6</span><textarea id="outputValue" readonly spellcheck="false" placeholder="整理后显示结果"></textarea></label><div class="actions"><button class="secondary" id="copyResult" disabled>复制</button><button class="secondary" id="downloadResult" disabled>下载 TXT</button></div><p id="copyStatus" class="status" role="status"></p></section></div></main><footer class="ops-footer"><span>本地处理 · 最多 20,000 行</span><span>网段合并不会展开全部地址</span></footer></div></body></html>
