<body><div class="watermark-shell">
<header class="ops-header watermark-header"><div class="title-group"><span class="title-symbol" aria-hidden="true"><i data-icon="stamp"></i></span><div><h1>图片水印</h1><p>批量 · 本地处理</p></div></div><span class="local"><i data-icon="shield-check"></i>图片不上传</span></header>
<main>
 <nav class="mobile-tabs" aria-label="图片水印视图"><button id="settingsTab" type="button" aria-pressed="true"><i data-icon="sliders-horizontal"></i>水印设置</button><button id="filesTab" type="button" aria-pressed="false"><i data-icon="images"></i>图片列表</button></nav>
 <div class="workbench" id="workbench" data-view="settings">
  <aside class="settings-card"><div class="card-head"><div><span class="eyebrow">样式</span><h2>水印设置</h2></div><button id="resetSettings" class="text-button">恢复默认</button></div>
   <label class="field text-field"><span>文字 <small id="textCount">0 / 160</small></span><textarea id="watermarkText" maxlength="160" rows="3">仅供授权验证使用</textarea></label>
   <div class="field-row"><label class="field color-field"><span>颜色</span><span class="color-control"><input id="watermarkColor" type="color" value="#5b5bd6"><output id="colorValue">#5b5bd6</output></span></label><label class="field"><span>格式</span><select id="format"><option value="auto">保持原格式</option><option value="jpeg">JPEG</option><option value="png">PNG</option><option value="webp">WebP</option></select></label></div>
   <div class="range-list"><label class="range-field"><span>透明度</span><input id="opacity" type="range" min="0.04" max="0.92" step="0.02" value="0.28"><output id="opacityValue">0.28</output></label><label class="range-field"><span>大小</span><input id="size" type="range" min="0.8" max="10" step="0.1" value="2.6"><output id="sizeValue">2.6%</output></label><label class="range-field"><span>间距</span><input id="spacing" type="range" min="1.2" max="8" step="0.2" value="2.8"><output id="spacingValue">2.8%</output></label><label class="range-field"><span>角度</span><input id="angle" type="range" min="-90" max="90" step="1" value="28"><output id="angleValue">28°</output></label></div>
   <div class="field"><span>布局</span><div class="mode-switch" role="group" aria-label="水印布局"><button id="repeatMode" type="button" aria-pressed="true">平铺</button><button id="singleMode" type="button" aria-pressed="false">单个</button></div></div>
   <div class="position-fields" id="positionFields" hidden><label class="range-field"><span>水平位置</span><input id="positionX" type="range" min="5" max="95" step="1" value="50"><output id="positionXValue">50%</output></label><label class="range-field"><span>垂直位置</span><input id="positionY" type="range" min="5" max="95" step="1" value="50"><output id="positionYValue">50%</output></label></div>
  </aside>
  <section class="workspace-card" id="dropZone"><div class="workspace-toolbar"><div class="workspace-title"><span class="eyebrow">批量处理</span><h2>图片预览</h2><small id="previewCaption">尚未选择图片</small></div><div class="workspace-actions"><input id="imageFiles" type="file" accept="image/*,.avif,.bmp,.gif" multiple hidden><button id="addFiles" class="secondary" type="button"><i data-icon="image-plus"></i><span>添加图片</span></button><button id="processAll" class="primary" type="button" disabled><i data-icon="circle-play"></i><span>处理全部</span></button><button id="cancelAll" class="secondary" type="button" hidden>停止</button><button id="downloadAll" class="secondary" type="button" disabled><i data-icon="download"></i><span>打包下载</span></button><button id="clearAll" class="text-button" type="button" disabled>清空</button></div></div>
   <div class="workspace-body"><div class="preview-stage" id="dropTarget"><img id="previewImage" alt="水印预览" hidden><div class="preview-empty" id="previewEmpty"><span>添加图片开始</span><small>可拖入、选择或粘贴图片</small><button id="dropOpen" type="button" class="secondary">选择图片</button></div><span class="drop-badge">拖放图片</span></div><aside class="file-panel"><div class="file-panel-head"><span id="fileCount">0 张 · 0 张完成</span><span>并行处理</span></div><ul id="fileList" class="file-list" aria-label="待处理图片"></ul></aside></div>
   <div class="workspace-status"><progress id="batchProgress" hidden></progress><p id="status" class="status" role="status" aria-live="polite">就绪</p></div>
  </section>
 </div>
</main></div>
</body></html>
