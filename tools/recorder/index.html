<div class="recorder-app">
  <header class="app-header">
    <a class="back-link" href="../../" aria-label="返回工具箱">← 工具箱</a>
    <div class="app-brand"><span class="app-mark"><svg><use href="#i-screen"/></svg></span><div><h1>屏幕录制</h1><span id="recordingState">准备就绪</span></div></div>
    <div class="recording-clock" id="clock" data-active="false"><i></i><span>00:00</span></div>
    <div class="mobile-actions"><button class="icon-button" id="openSettings" type="button" aria-label="录制设置"><svg><use href="#i-settings"/></svg></button><button class="icon-button" id="openLibrary" type="button" aria-label="本机作品，0"><svg><use href="#i-library"/></svg><b id="libraryCount">0</b></button></div>
  </header>

  <main class="app-main">
    <aside class="side-panel controls-panel" id="controlsPanel" aria-label="录制设置">
      <div class="panel-title"><h2>录制设置</h2><button class="icon-button panel-close" data-close-panel type="button" aria-label="关闭设置"><svg><use href="#i-x"/></svg></button></div>
      <div class="settings-scroll">
        <section class="setting-group">
          <span class="group-label">来源</span>
          <div class="segmented" id="sourceMode"><button type="button" data-value="screen" aria-pressed="true">屏幕</button><button type="button" data-value="camera" aria-pressed="false">摄像头</button></div>
        </section>
        <section class="setting-group">
          <label class="setting-row"><span>系统音频</span><input type="checkbox" id="systemAudio" checked></label>
          <label class="setting-row"><span>麦克风</span><input type="checkbox" id="microphone" checked></label>
          <label class="field" id="micDeviceField"><span>输入设备</span><select id="micDevice"><option value="">默认麦克风</option></select></label>
          <label class="setting-row compact"><span>按键说话</span><input type="checkbox" id="pushToTalk"></label>
        </section>
        <section class="setting-group">
          <div class="setting-head"><span class="group-label">摄像头叠层</span><input type="checkbox" id="cameraEnabled" aria-label="摄像头叠层"></div>
          <div id="cameraSettings" class="setting-body">
            <label class="field"><span>摄像头</span><select id="cameraDevice"><option value="">默认摄像头</option></select></label>
            <div class="two-fields"><label class="field"><span>形状</span><select id="cameraShape"><option value="circle">圆形</option><option value="rounded">圆角</option><option value="square">方形</option></select></label><label class="field"><span>大小</span><input type="range" id="cameraSize" min="12" max="40" value="24"></label></div>
            <div class="inline-options"><label><input type="checkbox" id="cameraMirror" checked> 镜像</label><label><input type="checkbox" id="cameraBlur"> 柔化</label></div>
          </div>
        </section>
        <section class="setting-group">
          <span class="group-label">输出</span>
          <div class="two-fields"><label class="field"><span>分辨率</span><select id="resolution"><option value="source">原始</option><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">2K</option></select></label><label class="field"><span>帧率</span><select id="frameRate"><option value="24">24 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option></select></label></div>
          <label class="field"><span>格式</span><select id="videoFormat"><option value="auto">自动最佳</option><option value="mp4">MP4</option><option value="webm">WebM</option></select></label>
          <div class="two-fields"><label class="field"><span>倒计时</span><select id="countdown"><option value="0">关闭</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select></label><label class="field"><span>自动停止</span><select id="autoStop"><option value="0">关闭</option><option value="5">5 分钟</option><option value="10">10 分钟</option><option value="30">30 分钟</option><option value="60">60 分钟</option></select></label></div>
          <label class="setting-row compact"><span>点击高亮</span><input type="checkbox" id="clickHighlight" checked></label>
        </section>
        <section class="setting-group annotation-settings">
          <span class="group-label">标注</span>
          <div class="color-size-row"><input type="color" id="annotationColor" value="#ef4444" aria-label="标注颜色"><input type="range" id="annotationSize" min="2" max="16" value="6" aria-label="画笔粗细"><span id="annotationSizeLabel">6 px</span></div>
          <label class="field" id="textField" hidden><span>文字</span><input id="annotationText" maxlength="120" placeholder="输入后点击画面放置"></label>
          <p class="shortcut-line">Alt+P 暂停 · Alt+S 结束 · Alt+Z 撤销</p>
        </section>
      </div>
    </aside>

    <section class="stage-panel" id="stagePanel">
      <div class="stage-toolbar">
        <div class="stage-meta"><span class="live-dot" id="liveDot"></span><strong id="sourceLabel">等待共享</strong><small id="canvasInfo">1080p · 30 fps</small></div>
        <div class="annotation-tools" id="annotationTools" role="toolbar" aria-label="标注工具">
          <button class="tool-button active" type="button" data-tool="none" aria-pressed="true" title="指针"><svg><use href="#i-pointer"/></svg></button>
          <button class="tool-button" type="button" data-tool="pen" aria-pressed="false" title="画笔"><svg><use href="#i-pen"/></svg></button>
          <button class="tool-button" type="button" data-tool="arrow" aria-pressed="false" title="箭头"><svg><use href="#i-arrow"/></svg></button>
          <button class="tool-button" type="button" data-tool="rect" aria-pressed="false" title="方框"><svg><use href="#i-rect"/></svg></button>
          <button class="tool-button" type="button" data-tool="text" aria-pressed="false" title="文字"><svg><use href="#i-text"/></svg></button>
          <button class="tool-button" type="button" data-tool="blur" aria-pressed="false" title="隐私遮罩"><svg><use href="#i-blur"/></svg></button>
          <button class="tool-button" type="button" id="spotlightToggle" aria-pressed="false" title="聚光灯"><svg><use href="#i-spotlight"/></svg></button>
          <button class="tool-button" type="button" id="undoAnnotation" title="撤销"><svg><use href="#i-undo"/></svg></button>
        </div>
        <button class="icon-button" id="fullscreen" type="button" aria-label="全屏预览"><svg><use href="#i-expand"/></svg></button>
      </div>
      <div class="canvas-shell" id="canvasShell">
        <canvas id="previewCanvas" width="1920" height="1080" aria-label="录制预览"></canvas>
        <video id="playbackVideo" playsinline controls hidden></video>
        <div class="stage-empty" id="stageEmpty"><span><svg><use href="#i-screen"/></svg></span><h2>选择来源开始录制</h2><p>屏幕、窗口、标签页或摄像头</p></div>
        <div class="countdown-overlay" id="countdownOverlay" hidden><strong>3</strong></div>
        <button class="close-playback" id="closePlayback" type="button" hidden>关闭预览</button>
      </div>
      <div class="transport">
        <div class="transport-info"><span class="status-dot"></span><div><strong id="recordStatus">就绪</strong><small id="recordDetails">本地处理，不上传文件</small></div><div class="mic-meter" id="micMeter" role="meter" aria-label="麦克风音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div></div>
        <div class="transport-actions"><button class="record-button" id="startRecord" type="button"><svg><use href="#i-record"/></svg><span>开始录制</span></button><button class="secondary-button" id="pauseRecord" type="button" aria-label="暂停录制" disabled><svg><use href="#i-pause"/></svg><span>暂停</span></button><button class="secondary-button stop" id="stopRecord" type="button" aria-label="结束录制" disabled><svg><use href="#i-stop"/></svg><span>结束</span></button></div>
      </div>
    </section>

    <aside class="side-panel library-panel" id="libraryPanel" aria-label="本机作品">
      <div class="panel-title"><h2>本机作品</h2><button class="icon-button panel-close" data-close-panel type="button" aria-label="关闭作品"><svg><use href="#i-x"/></svg></button></div>
      <div class="storage-card"><div><span>浏览器存储</span><strong id="storageText">检查中</strong></div><button type="button" class="text-button" id="persistStorage">持久化</button></div>
      <div class="editor-card" id="editorCard" hidden>
        <label class="field"><span>名称</span><input id="recordName" maxlength="80"></label>
        <div class="two-fields"><label class="field"><span>导出比例</span><select id="cropPreset"><option value="original">原始</option><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select></label><label class="setting-row compact"><span>保留音频</span><input type="checkbox" id="trimAudio" checked></label></div>
        <div class="trim-row"><label>起点</label><input type="range" id="trimStart" min="0" max="1" step="0.1" value="0"><output id="trimStartLabel">00:00</output></div>
        <div class="trim-row"><label>终点</label><input type="range" id="trimEnd" min="0" max="1" step="0.1" value="1"><output id="trimEndLabel">00:00</output></div>
        <div class="editor-actions"><button type="button" class="text-button" id="exportTrim">裁剪导出</button><button type="button" class="text-button" id="exportGif">导出 GIF</button><button type="button" class="text-button danger" id="deleteRecord"><svg><use href="#i-trash"/></svg>删除</button></div>
      </div>
      <div class="record-list" id="recordList" aria-label="录制列表"></div>
      <button class="library-download" id="downloadRecord" type="button" disabled><svg><use href="#i-download"/></svg>下载原片</button>
    </aside>
  </main>
  <div class="mobile-backdrop" id="mobileBackdrop"></div>
</div>
<dialog id="deleteDialog"><div class="dialog-icon"><svg><use href="#i-trash"/></svg></div><h2>删除录制？</h2><p>此操作无法撤销。</p><form method="dialog"><button class="secondary-button" value="cancel">取消</button><button class="danger-button" value="delete">删除</button></form></dialog>
</body>
</html>
