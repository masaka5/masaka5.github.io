</head><body><div class="studio-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>屏幕录制</h1><span class="pill" id="recordClock">00:00</span></header><main class="studio-main"><aside class="studio-controls"><h2>录制设置</h2><label class="field"><span>画质</span><select id="recordQuality"><option value="4000000">标准 · 4 Mbps</option><option value="8000000" selected>高清 · 8 Mbps</option><option value="16000000">高质量 · 16 Mbps</option></select></label><label class="check"><input type="checkbox" id="systemAudio" checked>请求共享音频</label><label class="check"><input type="checkbox" id="microphoneAudio">加入麦克风</label><div class="actions"><button id="startRecord" class="primary">开始录屏</button><button id="pauseRecord" class="secondary" disabled>暂停</button><button id="stopRecord" class="secondary" disabled>结束</button></div><p id="recordStatus" class="status" role="status">选择屏幕、窗口或标签页开始录制。</p><p class="inline-note">每秒暂存到浏览器，刷新后可恢复已保存内容。刷新会结束录制，最后未保存片段可能丢失。</p><div class="panel-head"><h2>本机录制</h2><button class="text-button" id="refreshRecords">刷新</button></div><div id="recordList" class="record-list" aria-label="暂存录制列表"></div><p id="storageInfo" class="inline-note">正在检查浏览器存储…</p><button class="text-button" id="persistStorage">申请持久存储</button></aside><section class="studio-stage"><div class="panel-head"><h2 id="previewTitle">录制预览</h2><div class="actions"><button id="downloadRecord" class="secondary" disabled>下载</button><button id="deleteRecord" class="text-button danger-text" disabled>删除</button></div></div><div class="media-frame"><video id="recordVideo" playsinline controls></video><p id="recordPlaceholder">开始录屏，或选择一条已暂存的录制</p></div><p id="recordDetails" class="inline-note">录制保存在当前浏览器与当前域名下，不上传服务器。</p></section></main><footer class="studio-footer"><span>共享音频由浏览器及共享对象决定</span><span>清理网站数据会删除暂存，请及时下载</span></footer></div><dialog id="deleteDialog"><h2 style="font-size:16px">删除这条录制？</h2><p class="inline-note" style="margin:12px 0">浏览器内的暂存片段会被永久删除。</p><form method="d
