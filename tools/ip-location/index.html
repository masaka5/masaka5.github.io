<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP 地理位置 · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><script defer src="../../assets/ops-ui.js"></script><script defer src="../../assets/net-core.js"></script><script defer src="location.js"></script></head><body data-view="input"><div class="ops-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>IP 地理位置</h1><a class="header-action" href="../dns/">DNS 查询 →</a></header><main class="ops-main"><nav class="workspace-tabs" aria-label="视图"><button data-view-target="input" aria-pressed="true">查询</button><button data-view-target="result" aria-pressed="false">结果</button></nav><div class="ops-workspace"><section class="ops-panel" data-pane="input"><h2>公网 IP 查询</h2><label class="field"><span>IPv4／IPv6（留空查询出口 IP）</span><input class="mono" id="locationIP" placeholder="8.8.8.8" maxlength="60" autocomplete="off"></label><label class="field"><span>数据来源</span><select id="locationProvider"><option value="info" selected>IPinfo</option><option value="api">IPapi.co</option><option value="who">IPWho.is</option></select></label><div class="actions"><button class="primary" id="queryLocation">查询</button><button class="secondary" id="myLocation">查询我的 IP</button><button class="secondary" id="stopLocation" disabled>停止</button></div><p class="status" id="locationStatus" role="status"></p><p class="help">查询 IP 会发送至所选服务，可能受额度、跨域或网络限制。位置为网络出口的近似归属，不是设备精确定位。</p></section><section class="ops-panel" data-pane="result"><div class="panel-head"><h2>归属信息</h2><button class="text-button" id="copyLocation" disabled>复制</button></div><dl class="result-fields" id="locationFields"></dl><p class="status" id="locationResultStatus" role="status"></p></section></div></main><footer class="ops-footer"><span>数据由第三方提供 · 结果可能有误差</span><span id="locationSource"></span></footer></div></body>
