<body>
<div class="ai-shell">
  <header class="ops-header ai-header">
    <div class="ai-title-group"><span class="ai-symbol" aria-hidden="true"><i data-icon="messages-square"></i></span><div><h1>AI 助手</h1><p>本地优先 · 浏览器运行</p></div></div>
    <div class="ai-head-actions"><button class="ghost-action" id="localChat" title="切换到本地模型"><i data-icon="archive"></i><span>本地模型</span></button><button class="ghost-action" id="openSettings" title="配置接口模式"><i data-icon="settings-2"></i><span>接口</span></button></div>
  </header>

  <nav class="ai-toolbar" aria-label="对话操作">
    <div class="model-state"><span class="model-indicator" aria-hidden="true"></span><span id="modelLabel">Spark-X2.6 · 4B Q4 · 未加载</span><span class="cache-label" id="cacheLabel" title="模型缓存保存在当前浏览器"></span></div>
    <div class="toolbar-actions"><button class="tool-action" id="clearChat" title="清空当前对话"><i data-icon="eraser"></i><span>清空</span></button><button class="tool-action" id="newChat" title="开始新对话"><i data-icon="plus"></i><span>新对话</span></button><button class="tool-action" id="exportChat" disabled title="导出当前对话"><i data-icon="download"></i><span>导出</span></button><span class="toolbar-separator" aria-hidden="true"></span><a href="https://www.doubao.com/chat/" target="_blank" rel="noopener noreferrer">豆包<i data-icon="arrow-up-right"></i></a><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT<i data-icon="arrow-up-right"></i></a></div>
  </nav>

  <div class="context-strip" id="contextStrip" hidden><button type="button" id="taskStatus" class="task-status" hidden></button><button type="button" id="contextNotice" class="context-notice" role="status" aria-live="polite" hidden></button></div>

  <main class="ai-workspace">
    <section class="chat-feed" id="chatFeed" aria-label="对话记录" aria-busy="false">
      <div class="chat-empty" id="chatEmpty">
        <span class="empty-mark" aria-hidden="true"><i data-icon="messages-square"></i></span>
        <div class="empty-copy"><h2>今天要处理什么？</h2><p>本地模型与兼容接口都在同一个对话中。</p></div>
        <div class="prompt-starters" aria-label="快捷提问"><button type="button" data-prompt="帮我总结以下内容，提炼重点和行动项：">总结内容</button><button type="button" data-prompt="解释下面的代码，指出风险并给出改进建议：">检查代码</button><button type="button" data-prompt="请把需求整理成清晰、可执行的步骤清单：">整理步骤</button></div>
        <div class="empty-actions"><button class="primary" id="useLocal">加载本地模型</button><button class="secondary" id="setupChat">连接接口</button></div>
        <p class="web-note">首次加载约 2.8 GB，之后可离线使用。</p>
      </div>
    </section>

    <form class="composer" id="chatForm">
      <div class="attachments" id="attachments" aria-label="待发送附件"></div>
      <textarea id="prompt" rows="3" placeholder="输入消息，可粘贴长文本" aria-label="消息"></textarea>
      <div class="compose-actions">
        <div class="compose-tools"><button class="compose-chip" id="attach" type="button" aria-label="添加 TXT 附件" title="添加 TXT 附件"><i data-icon="paperclip"></i><span>TXT</span></button><select id="sendShortcut" aria-label="发送快捷键" title="选择发送快捷键"><option value="enter">Enter 发送</option><option value="ctrl">Ctrl / ⌘ + Enter</option></select><input type="file" id="files" hidden multiple accept=".txt,text/plain"/></div>
        <div class="send-actions"><button class="secondary" id="stop" type="button" hidden>停止</button><button class="primary" id="send" type="submit"><span>发送</span><i data-icon="send"></i></button></div>
      </div>
    </form>
    <footer class="ai-footer"><p id="chatStatus" class="status" role="status"></p></footer>
  </main>
</div>

<dialog id="taskDialog" class="ai-dialog"><form id="taskForm"><div class="dialog-head"><div><span class="dialog-kicker">上下文</span><h2>当前任务</h2></div><button type="button" id="closeTask" class="icon-button" aria-label="关闭"><i data-icon="x"></i></button></div><label class="field"><span>目标</span><textarea id="taskGoal" rows="3" required></textarea></label><label class="field"><span>固定重点</span><textarea id="taskFacts" rows="4" placeholder="每行保留一条"></textarea></label><div class="actions"><button type="submit" class="primary">保存</button><button type="button" id="taskComplete" class="secondary">标记完成</button></div></form></dialog>
<dialog id="contextDialog" class="ai-dialog"><div class="dialog-head"><div><span class="dialog-kicker">上下文</span><h2>检查点</h2></div><button type="button" id="closeContext" class="icon-button" aria-label="关闭"><i data-icon="x"></i></button></div><pre id="contextSummary"></pre></dialog>
<dialog id="settings" class="ai-dialog"><form id="settingsForm"><div class="dialog-head"><div><span class="dialog-kicker">连接</span><h2>接口设置</h2></div><button type="button" id="closeSettings" class="icon-button" aria-label="关闭接口设置"><i data-icon="x"></i></button></div><label class="field"><span>请求地址</span><input type="url" id="endpoint" placeholder="https://api.example.com/v1/chat/completions" required autocomplete="off"/></label><label class="field"><span>模型</span><input id="model" placeholder="模型名称" maxlength="100" required autocomplete="off"/></label><label class="field"><span>API 密钥</span><input type="password" id="apiKey" autocomplete="off" maxlength="4096" placeholder="仅保存在当前页面"/></label><p class="status" id="settingsStatus" role="status"></p><div class="actions"><button class="primary" type="submit">应用</button><button class="secondary" type="button" id="forgetSettings">清除配置</button></div></form></dialog>
</body></html>
