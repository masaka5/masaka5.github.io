<body><div class="ai-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>AI 助手</h1><div class="ai-head-actions"><button class="text-button" id="localChat">本地模型</button><button class="text-button" id="openSettings">接口设置</button></div></header>
<nav class="ai-toolbar" aria-label="对话操作"><span id="modelLabel">Spark-X2.6 · 4B Q4 · 未加载</span><div><span class="cache-label" id="cacheLabel" title="模型缓存保存在当前浏览器"></span><button class="text-button" id="clearChat">清空</button><button class="text-button" id="newChat">新对话</button><button class="text-button" id="exportChat" disabled>导出</button><a href="https://www.doubao.com/chat/" target="_blank" rel="noopener noreferrer">豆包 ↗</a><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT ↗</a></div></nav>
<div class="context-strip" id="contextStrip" hidden><button type="button" id="taskStatus" class="task-status" hidden></button><button type="button" id="contextNotice" class="context-notice" role="status" aria-live="polite" hidden></button></div>
<main class="chat-feed" id="chatFeed" aria-label="对话记录" aria-busy="false"><div class="chat-empty" id="chatEmpty"><h2>有什么需要处理？</h2><div class="empty-actions"><button class="primary" id="useLocal">本地运行</button><button class="secondary" id="setupChat">接口模式</button></div><p class="web-note">本地模型首次使用会下载约 2.8 GB，完成后可离线使用。</p></div></main>
<form class="composer" id="chatForm"><div class="attachments" id="attachments" aria-label="待发送附件"></div><textarea id="prompt" rows="3" placeholder="输入问题，Shift + Enter 换行" aria-label="消息"></textarea><div class="compose-actions"><div><button class="secondary" id="attach" type="button">＋ 附件</button><select id="sendShortcut" aria-label="发送快捷键"><option value="enter">Enter 发送</option><option value="ctrl">Ctrl / ⌘ + Enter 发送</option></select><input type="file" id="files" hidden multiple accept="image/png,image/jpeg,image/webp,.txt,.md,.csv,.json,.log,.xml,.yaml,.yml,.html,.css,.js,.ts,.py,.sh,.ps1,.sql,.ini,.conf"/></div><button class="primary" id="send" type="submit">发送</button><button class="secondary" id="stop" type="button" hidden>停止</button></div></form>
<footer class="ai-footer"><p id="chatStatus" class="status" role="status"></p></footer></div>
<dialog id="taskDialog"><form id="taskForm"><div class="panel-head"><h2>当前任务</h2><button type="button" id="closeTask" class="text-button">关闭</button></div><label class="field"><span>目标</span><textarea id="taskGoal" rows="3" required></textarea></label><label class="field"><span>固定重点</span><textarea id="taskFacts" rows="4" placeholder="每行一条，整理上下文时原样保留"></textarea></label><div class="actions"><button type="submit" class="primary">保存</button><button type="button" id="taskComplete" class="secondary">标记完成</button></div></form></dialog>
<dialog id="contextDialog"><div class="panel-head"><h2>上下文检查点</h2><button type="button" id="closeContext" class="text-button">关闭</button></div><pre id="contextSummary"></pre></dialog>
<dialog id="settings"><form id="settingsForm"><div class="panel-head"><h2>接口设置</h2><button type="button" id="closeSettings" class="text-button" aria-label="关闭接口设置">关闭</button></div><p class="settings-note">兼容 OpenAI Chat Completions 的接口。</p><label class="field"><span>请求地址</span><input type="url" id="endpoint" placeholder="https://你的接口/v1/chat/completions" required autocomplete="off"/></label><label class="field"><span>模型</span><input id="model" placeholder="接口提供的模型名称" maxlength="100" required autocomplete="off"/></label><label class="field"><span>API 密钥</span><input type="password" id="apiKey" autocomplete="off" maxlength="4096"/></label><p class="settings-note">密钥仅保存在当前页面。图片需接口支持视觉。</p><p class="status" id="settingsStatus" role="status"></p><div class="actions"><button class="primary" type="submit">应用</button><button class="secondary" type="button" id="forgetSettings">清除配置</button></div></form></dialog>
</body></html>
