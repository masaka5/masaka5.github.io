<body><div class="ai-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>AI 助手</h1><div class="ai-head-actions"><button class="text-button" id="localChat">本地模型</button><button class="text-button" id="openSettings">接口设置</button></div></header>
<nav class="ai-toolbar" aria-label="对话操作"><span id="modelLabel">DeepSeek-R1 · Qwen 1.5B · 未加载</span><div><a href="https://www.doubao.com/chat/" target="_blank" rel="noopener noreferrer">豆包 ↗</a><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT ↗</a><button class="text-button" id="newChat">新对话</button><button class="text-button" id="exportChat" disabled>导出</button></div></nav>
<main class="chat-feed" id="chatFeed" aria-label="对话记录" aria-busy="false"><div class="chat-empty" id="chatEmpty"><h2>有什么需要处理？</h2><p>文字和附件可在浏览器本地运行</p><div class="empty-actions"><button class="primary" id="useLocal">本地运行</button><button class="secondary" id="setupChat">接口模式</button></div><p class="web-note">本地模型首次使用会下载并缓存约 1.4 GB，支持 WebGPU。</p></div></main>
<form class="composer" id="chatForm"><div class="attachments" id="attachments" aria-label="待发送附件"></div><textarea id="prompt" rows="3" maxlength="60000" placeholder="输入问题，或粘贴图片…" aria-label="消息"></textarea><div class="compose-actions"><div><button class="secondary" id="attach" type="button">＋ 附件</button><span class="attachment-note">图片 / 文本 · 最多 5 个，共 10 MB</span><input type="file" id="files" hidden multiple accept="image/png,image/jpeg,image/webp,.txt,.md,.csv,.json,.log,.xml,.yaml,.yml,.html,.css,.js,.ts,.py,.sh,.ps1,.sql,.ini,.conf"/></div><button class="primary" id="send" type="submit">发送</button><button class="secondary" id="stop" type="button" hidden>停止</button></div></form>
<footer class="ai-footer"><p id="chatStatus" class="status" role="status">可选择本地模型，或配置兼容接口。</p><span>对话仅在当前页面保留</span></footer></div>
<dialog id="settings"><form id="settingsForm"><div class="panel-head"><h2>接口设置</h2><button type="button" id="closeSettings" class="text-button" aria-label="关闭接口设置">关闭</button></div><p class="settings-note">使用兼容 OpenAI 的对话接口。网页版地址不能作为 API。</p><label class="field"><span>完整请求地址</span><input type="url" id="endpoint" placeholder="https://你的接口/v1/chat/completions" required autocomplete="off"/></label><label class="field"><span>模型名称</span><input id="model" placeholder="填写接口提供的模型名称" maxlength="100" required autocomplete="off"/></label><label class="field"><span>API 密钥（接口无鉴权时可留空）</span><input type="password" id="apiKey" autocomplete="off" maxlength="4096"/></label><p class="settings-note">附件随消息发送到此地址。图片需要模型支持视觉；PDF、Office 文件请到官方网页版上传。更换接口或模型会新建对话，密钥不写入本地存储。</p><p class="status" id="settingsStatus" role="status"></p><div class="actions"><button class="primary" type="submit">应用</button><button class="secondary" type="button" id="forgetSettings">清除配置</button></div></form></dialog>
</body></html>
