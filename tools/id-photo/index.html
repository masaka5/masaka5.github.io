<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
<meta name="toolbox-tool-id" content="id-photo"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8">
  <link rel="icon" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../assets/design-system.css">
  <link rel="stylesheet" href="../../assets/reference-tool-theme.css?v=20261119">
  <link rel="stylesheet" href="id-photo.css?v=20261121a">
  <script type="module" src="id-photo.js?v=20261121b"></script>
  <title>在线证件照 · 口袋工具箱</title>
  <meta name="description" content="本地证件照制作：51 套规格、精细 AI 去背、3 倍超分、换底色、裁切与六寸排版下载。">
  <link rel="canonical" href="https://tools.manshii.asia/catalog/id-photo/">
  <meta name="robots" content="index,follow,max-image-preview:large">
<script type="module" src="../../assets/tool-entry.mjs?v=20261120-stat1"></script></head>
<body>
<svg class="sprite" aria-hidden="true"><symbol id="i-id" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><circle cx="12" cy="9" r="3"/><path d="M8 17c.8-2 2.2-3 4-3s3.2 1 4 3"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M5 20h14"/></symbol><symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="4"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M5 21h14"/></symbol><symbol id="i-wand" viewBox="0 0 24 24"><path d="m4 20 12-12M13 5l2-2M18 10l2-2M16 3l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/></symbol><symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 4v6h6M5 10a8 8 0 1 1 1 7"/></symbol><symbol id="i-rotate" viewBox="0 0 24 24"><path d="M4 7h5V2M5 6a9 9 0 1 1-1 8"/></symbol><symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></symbol></svg>
<div class="id-app">
  <header class="app-header">
    <a class="back-link" href="../../" aria-label="返回工具箱">← 工具箱</a>
    <div class="brand"><span class="brand-mark"><svg><use href="#i-id"/></svg></span><div><h1>在线证件照</h1><small id="statusText">本地处理 · 无水印</small></div></div>
    <div class="header-actions"><button class="secondary-button" id="cameraButton" type="button"><svg><use href="#i-camera"/></svg>拍摄</button><button class="secondary-button" id="uploadButton" type="button"><svg><use href="#i-upload"/></svg>上传</button><button class="primary-button" id="makeButton" type="button" disabled><svg><use href="#i-wand"/></svg>制作</button><button class="icon-button mobile-toggle" id="mobileToggle" type="button" aria-label="切换照片与结果"><svg><use href="#i-grid"/></svg></button></div>
  </header>
  <main class="id-workspace">
    <aside class="control-panel" id="controlPanel">
      <div class="panel-inner">
        <section class="setting-card">
          <div class="section-title"><h2>规格</h2><button class="text-button" id="applyCustom" type="button" hidden>应用</button></div>
          <input id="specSearch" class="search-input" type="search" placeholder="搜索一寸、护照、签证…" autocomplete="off">
          <select id="specSelect" aria-label="证件照规格"></select>
          <div class="chips" id="quickSpecs"></div>
          <details class="custom-spec" id="customSpec"><summary>自定义尺寸</summary><div class="unit-switch"><button class="active" type="button" data-unit="mm">毫米</button><button type="button" data-unit="px">像素</button></div><div class="custom-grid"><label><span>宽</span><input id="customWidth" type="number" value="25" min="10" max="5000"></label><label><span>高</span><input id="customHeight" type="number" value="35" min="10" max="5000"></label><label><span>DPI</span><input id="customDpi" type="number" value="300" min="72" max="600"></label></div></details>
        </section>
        <section class="setting-card">
          <div class="section-title"><h2>背景</h2></div>
          <div class="backgrounds"><button class="bg-choice active" type="button" data-bg="#ffffff" style="--color:#fff" aria-label="白色"></button><button class="bg-choice" type="button" data-bg="#e8e8e8" style="--color:#e8e8e8" aria-label="浅灰"></button><button class="bg-choice" type="button" data-bg="#438edb" style="--color:#438edb" aria-label="蓝色"></button><button class="bg-choice" type="button" data-bg="#e43d30" style="--color:#e43d30" aria-label="红色"></button><label class="bg-custom"><input id="customBg" type="color" value="#d9e9f7"><span>自定义</span></label></div>
          <label class="setting-row"><span>智能去背</span><input id="removeBg" type="checkbox" role="switch" checked></label><label class="setting-row engine-row"><span>去背引擎</span><select id="bgEngine"><option value="auto">自动·精细</option><option value="precise">精细 AI</option><option value="fast">快速</option><option value="mediapipe">兼容</option></select></label>
          <label class="setting-row"><span>保留原背景</span><input id="keepBg" type="checkbox" role="switch"></label>
        </section>
        <section class="setting-card">
          <div class="section-title"><h2>调整</h2><button class="text-button" id="resetCrop" type="button">复位</button></div>
          <label class="slider-row"><span>缩放</span><input id="zoom" type="range" min="80" max="280" value="100"><output>100%</output></label>
          <label class="slider-row"><span>旋转</span><input id="rotate" type="range" min="-180" max="180" value="0"><output>0°</output></label>
          <label class="slider-row"><span>美白</span><input id="whiten" type="range" min="0" max="100" value="0"><output>0</output></label>
          <label class="slider-row"><span>磨皮</span><input id="smooth" type="range" min="0" max="100" value="0"><output>0</output></label><label class="setting-row"><span>WebGPU 超分 <b>3×</b></span><input id="superRes" type="checkbox" role="switch"></label>
        </section>
        <section class="setting-card">
          <div class="section-title"><h2>导出</h2></div>
          <div class="two-fields"><label><span>格式</span><select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></label><label><span>大小上限 KB</span><input id="sizeLimit" type="number" min="10" max="10000" placeholder="不限"></label></div>
        </section>
      </div>
    </aside>

    <section class="crop-panel">
      <div class="stage-toolbar"><div><strong id="sourceTitle">上传照片</strong><span id="specMeta">一寸 · 25×35 mm · 300 DPI</span></div><div class="stage-actions"><button class="icon-button" id="rotateLeft" type="button" aria-label="向左旋转"><svg><use href="#i-rotate"/></svg></button><button class="icon-button" id="clearPhoto" type="button" aria-label="移除照片" disabled><svg><use href="#i-trash"/></svg></button></div></div>
      <div class="stage" id="stage">
        <canvas id="cropCanvas" width="413" height="579"></canvas>
        <div class="upload-empty" id="uploadEmpty"><span><svg><use href="#i-upload"/></svg></span><strong>上传正面照片</strong><small>支持拖放、粘贴与摄像头</small><button class="primary-button" id="emptyUpload" type="button">选择照片</button></div>
        <div class="model-progress" id="modelProgress" hidden><span id="modelProgressLabel">正在处理</span><i><b id="modelProgressBar"></b></i><output id="modelProgressText">0%</output></div>
      </div>
      <div class="crop-footer"><div class="zoom-note"><span>拖动画布调整位置</span><span>滚轮缩放</span></div><div class="status-inline" id="stageStatus"></div></div>
    </section>

    <aside class="result-panel" id="resultPanel">
      <div class="panel-title"><div><h2>结果</h2><small id="resultMeta">尚未生成</small></div><button class="text-button" id="resultDownload" type="button" disabled>下载</button></div>
      <div class="result-preview"><canvas id="resultCanvas" width="295" height="413"></canvas><div class="result-empty" id="resultEmpty">制作后显示</div></div>
      <div class="print-card"><div class="panel-title"><div><h3>6 寸排版</h3><small>自动排列</small></div><button class="text-button" id="layoutDownload" type="button" disabled>下载</button></div><canvas id="layoutCanvas" width="540" height="760"></canvas></div>
      <div class="result-actions"><button class="secondary-button" id="generate" type="button" disabled><svg><use href="#i-wand"/></svg>生成照片</button><button class="secondary-button" id="reupload" type="button" disabled><svg><use href="#i-upload"/></svg>重新上传</button></div>
    </aside>
  </main>
  <nav class="mobile-tabs" aria-label="证件照工作区"><button type="button" data-mobile-view="controls">规格</button><button type="button" data-mobile-view="crop" class="active">照片</button><button type="button" data-mobile-view="result">结果</button></nav>
  <input id="fileInput" type="file" accept="image/*" hidden>
  <video id="cameraVideo" playsinline autoplay muted hidden></video>
  <dialog id="cameraDialog"><div class="dialog-head"><h2>拍摄照片</h2><button class="icon-button" id="closeCamera" type="button" aria-label="关闭">×</button></div><video id="cameraPreview" playsinline autoplay muted></video><button class="primary-button" id="capturePhoto" type="button">拍摄</button></dialog>
  <div class="drop-overlay" id="dropOverlay" hidden><svg><use href="#i-upload"/></svg><strong>松开上传照片</strong></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</body>
</html>
