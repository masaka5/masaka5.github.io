<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><meta name="description" content="本地 AES-GCM 加密的一次性阅后即焚工具，支持文本、密码、验证码、链接、代码和图片，通过二维码在设备间查看。"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https: wss: http: ws:; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'none'"><title>阅完即焚 · 口袋工具箱</title><link rel="canonical" href="https://tools.manshii.asia/catalog/burn/"><meta name="robots" content="index,follow,max-image-preview:large"><meta property="og:type" content="website"><meta property="og:title" content="阅完即焚 · 口袋工具箱"><meta property="og:description" content="本地 AES-GCM 加密，一次性查看，阅读后自动或手动销毁。"><meta property="og:url" content="https://tools.manshii.asia/catalog/burn/"><meta property="og:image" content="https://tools.manshii.asia/assets/share-card.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="阅完即焚 · 口袋工具箱"><meta name="twitter:description" content="本地 AES-GCM 加密，一次性查看，阅读后自动或手动销毁。"><meta name="twitter:image" content="https://tools.manshii.asia/assets/share-card.png"><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="/assets/reference-tool-theme.css?v=20261116c"><link rel="stylesheet" href="burn.css?v=20261118-burn2"><script defer src="../../assets/tool-icon-paths.js"></script><script defer src="../../assets/tool-icons.js"></script><script defer src="/assets/reference-tool-shell.js?v=20261116c"></script><script defer src="/vendor/qrcode.min.js?v=20261117a"></script><script defer src="/vendor/zxing/reader.js?v=20261117a"></script><script type="module" src="burn.js?v=20261118-burn2"></script></head>
<body><div class="burn-shell">
<header class="ops-header burn-header"><div class="burn-title"><span class="burn-symbol" aria-hidden="true"><i data-icon="zap"></i></span><div><h1>阅完即焚</h1><p>AES-GCM · 一次性读取</p></div></div><div class="header-actions"><span class="connection-pill" id="connectionStatus" data-state="idle"><i></i><span>本地就绪</span></span><button id="openScanner" class="ghost-button" type="button" aria-label="扫码"><i data-icon="scan-line"></i><span>扫码</span></button></div></header>
<main>
 <section id="createView" class="create-view">
  <section class="compose-card"><div class="card-head"><div><span class="eyebrow">内容</span><h2>创建阅焚内容</h2></div><button id="resetDraft" class="text-button" type="button">重置</button></div>
   <div class="type-switch" role="group" aria-label="内容类型"><button type="button" data-type="text" aria-pressed="true">文本</button><button type="button" data-type="password" aria-pressed="false">密码</button><button type="button" data-type="otp" aria-pressed="false">验证码</button><button type="button" data-type="link" aria-pressed="false">链接</button><button type="button" data-type="code" aria-pressed="false">代码</button><button type="button" data-type="image" aria-pressed="false">图片</button></div>
   <label class="field label-field"><span>标题 <small id="labelCount">0 / 80</small></span><input id="contentLabel" maxlength="80" placeholder="可选，仅显示给接收方" autocomplete="off"></label>
   <div class="text-input-wrap" id="textInputWrap"><textarea id="contentText" maxlength="200000" aria-label="阅焚内容" placeholder="输入需要一次性发送的内容" spellcheck="false"></textarea></div>
   <div class="image-input-wrap" id="imageInputWrap" hidden><input id="contentImage" type="file" accept="image/*,.avif,.bmp,.gif" hidden><button id="chooseImage" class="image-drop" type="button"><span class="image-placeholder"><i data-icon="image-plus"></i><strong>选择图片</strong><small>支持拖入或粘贴，最大 24 MB</small></span><img id="imagePreview" alt="图片预览" hidden></button><div class="image-meta" id="imageMeta"></div></div>
   <div class="compose-footer"><span id="contentSize">0 B</span><button id="createShare" class="primary" type="button"><i data-icon="send"></i><span>生成阅焚链接</span></button></div>
  </section>  <aside class="controls-card"><div class="card-head"><div><span class="eyebrow">安全</span><h2>销毁规则</h2></div></div>
   <label class="field"><span>阅读后销毁</span><select id="timerChoice"><option value="10">10 秒</option><option value="30" selected>30 秒</option><option value="60">1 分钟</option><option value="custom">自定义</option><option value="0">仅手动销毁</option></select></label>
   <label class="field custom-time" id="customTimeField" hidden><span>自定义秒数</span><input id="customSeconds" type="number" min="1" max="3600" value="90"></label>
   <label class="switch-row"><span><strong>失焦自动隐藏</strong><small>切换页面时遮挡内容</small></span><input id="hideOnBlur" class="switch" type="checkbox" role="switch" checked></label>
   <label class="switch-row"><span><strong>失焦立即销毁</strong><small>离开页面后不可恢复</small></span><input id="burnOnBlur" class="switch" type="checkbox" role="switch"></label>
   <label class="switch-row"><span><strong>禁止复制</strong><small>禁用复制、剪切和文本选择</small></span><input id="noCopy" class="switch" type="checkbox" role="switch" checked></label>
   <label class="switch-row"><span><strong>动态水印</strong><small>显示接收时间与随机标识</small></span><input id="dynamicWatermark" class="switch" type="checkbox" role="switch" checked></label>
   <label class="field"><span>连接方式</span><select id="signalMode"><option value="mqtt">公共 MQTT</option><option value="nostr">公共 Nostr</option></select></label>
   <p class="security-note"><i data-icon="shield-check"></i>内容仅短暂保存在设备内存中。</p>
  </aside>
 </section>
 <section id="shareView" class="share-view" hidden><div class="share-card"><div class="share-state"><span class="state-icon" aria-hidden="true"><i data-icon="qr-code"></i></span><span class="eyebrow">等待接收</span><h2>二维码已生成</h2><p id="shareStatus" role="status" aria-live="polite">正在连接信令服务…</p></div><div class="qr-wrap"><canvas id="shareQr" width="260" height="260" aria-label="阅焚链接二维码"></canvas></div><div class="share-link-row"><input id="shareLink" type="text" readonly aria-label="阅焚链接"><button id="copyShareLink" class="secondary" type="button"><span>复制</span></button></div><div class="share-meta"><span>仅第一次访问有效</span><span id="shareProgress">0%</span></div><button id="cancelShare" class="text-button" type="button">取消并销毁</button></div></section>
 <section id="receiveView" class="receive-view" hidden><div class="receive-card">
  <div class="receive-state" id="receiveWaiting"><span class="state-icon pulse" aria-hidden="true"><i data-icon="radio"></i></span><span class="eyebrow">加密接收</span><h2>正在连接</h2><p id="receiveStatus" role="status" aria-live="polite">正在准备安全通道…</p><div class="receive-progress"><progress id="receiveProgress" max="100" value="0"></progress><span id="receiveProgressText">0%</span></div></div>
  <div class="receive-state" id="receiveReady" hidden><span class="state-icon" aria-hidden="true"><i data-icon="mail"></i></span><span class="eyebrow">内容已校验</span><h2 id="receiveTitle">收到阅焚内容</h2><p id="receiveMeta"></p><button id="openContent" class="primary" type="button"><i data-icon="eye"></i><span>打开内容</span></button></div>
  <div class="sensitive-shell" id="sensitiveShell" hidden><div class="sensitive-head"><div><span class="eyebrow">只读</span><h2 id="sensitiveTitle">阅焚内容</h2></div><div class="sensitive-actions"><span class="countdown" id="countdown">手动销毁</span><button id="toggleSecret" class="secondary" type="button" hidden>显示</button><button id="burnNow" class="secondary danger-lite" type="button"><i data-icon="zap"></i><span>销毁</span></button></div></div><div class="sensitive-viewport" id="sensitiveViewport"></div><div class="watermark-layer" id="watermarkLayer" aria-hidden="true"></div><div class="privacy-veil" id="privacyVeil" hidden><span class="state-icon"><i data-icon="eye-off"></i></span><strong>内容已遮挡</strong><button id="revealAgain" class="secondary" type="button">重新查看</button></div></div>
  <div class="receive-state burned-state" id="burnedView" hidden><span class="state-icon" aria-hidden="true"><i data-icon="zap"></i></span><span class="eyebrow">已销毁</span><h2 id="burnedTitle">内容已清除</h2><p id="burnedText">此内容无法再次读取</p><button id="createAnother" class="primary" type="button">创建新内容</button></div>
 </div></section>
</main></div>
<dialog id="scanDialog" class="scan-dialog" aria-labelledby="scanTitle" aria-describedby="scanStatus"><div class="dialog-head"><div><span class="eyebrow">二维码</span><h2 id="scanTitle">扫描阅焚内容</h2></div><button id="closeScanner" class="icon-button" type="button" aria-label="关闭"><i data-icon="x"></i></button></div><div class="scanner-stage"><video id="scanVideo" playsinline muted></video><div class="scanner-frame" aria-hidden="true"><i></i><i></i><i></i><i></i><span></span></div></div><p id="scanStatus" class="status" role="status" aria-live="polite">正在启动摄像头…</p><div class="dialog-actions"><select id="cameraSelect" aria-label="摄像头"><option value="">默认摄像头</option></select><button id="switchCamera" class="secondary" type="button">切换</button></div></dialog>
<div class="global-drop" id="globalDrop" aria-hidden="true" hidden><span data-icon="image-plus"></span><strong>松开以加入图片</strong></div>
</body></html>
