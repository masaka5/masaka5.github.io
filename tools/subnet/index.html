<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>IP／子网计算器 · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"/><link rel="stylesheet" href="../../assets/ops.css"/><script defer src="../../assets/net-core.js"></script><script defer src="../../assets/ops-ui.js"></script><script defer src="../../assets/ops-tools.js"></script></head>
<body data-tool="subnet" data-view="input"><div class="ops-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>IP／子网计算器</h1><span></span></header><main class="ops-main"><nav class="workspace-tabs" aria-label="工具视图"><button data-view-target="input" aria-pressed="true">输入</button><button data-view-target="result" aria-pressed="false">结果</button></nav><div class="ops-workspace"><section class="ops-panel" data-pane="input"><h2>地址与网段</h2><form id="toolForm"><label class="field"><span>IP 地址／前缀或掩码</span><input id="inputValue" class="mono" value="192.168.1.55/24" autocomplete="off" spellcheck="false" maxlength="100"/></label><div class="actions" style="margin-top:16px"><button class="primary" type="submit">计算</button><button class="secondary" id="ipv6Example" type="button">IPv6 示例</button></div></form><p id="toolStatus" class="status" role="status"></p><p class="help">支持 IPv4、IPv6 与连续子网掩码。IPv4 的 /31 按点对点地址计算。</p></section><section class="ops-panel" data-pane="result"><div class="panel-head"><h2>计算结果</h2><button class="text-button" id="copyResult">复制</button></div><dl class="result-fields" id="resultFields"></dl><p id="copyStatus" class="status" role="status"></p></section></div></main><footer class="ops-footer"><span>本地计算</span><span>IPv4 / IPv6</span></footer></div></body></html>
