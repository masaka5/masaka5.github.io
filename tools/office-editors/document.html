<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>富文本文档 · 工具箱</title><meta name="description" content="本地富文本文档编辑器，支持表格、图片、JSON和HTML。"><link rel="icon" href="../../assets/favicon.svg">  <script type="module" crossorigin src="./assets/document-jNvTpa-1.js"></script>

</head><body><div class="editor-shell"><header class="editor-header"><a href="../../">← 工具箱</a><h1>富文本文档</h1><input id="title" class="document-title" aria-label="文档名称" value="未命名文档" maxlength="100"><span class="save-status" id="saveStatus" role="status"></span></header><nav class="toolbar" aria-label="文档工具栏"><button id="importButton">打开</button><button id="exportJSON">保存项目</button><button id="exportHTML">导出 HTML</button><span class="separator"></span><select id="heading" aria-label="段落类型"><option value="0">正文</option><option value="1">标题一</option><option value="2">标题二</option><option value="3">标题三</option></select><button id="docBold" aria-pressed="false">加粗</button><button id="docItalic" aria-pressed="false">斜体</button><button id="docUnderline" aria-pressed="false">下划线</button><button id="bulletList">无序列表</button><button id="orderedList">有序列表</button><button id="quote">引用</button><button id="codeBlock">代码</button><button id="alignLeft">左对齐</button><button id="alignCenter">居中</button><button id="alignRight">右对齐</button><button id="link">链接</button><button id="image">图片</button><button id="table">表格</button><button id="row">添加行</button><button id="column">添加列</button><button id="removeTable">删除表格</button><button id="undo">撤销</button><button id="redo">重做</button></nav><main class="editor-stage"><div class="document-sheet"><div id="editor"></div></div></main></div><input id="importFile" type="file" accept=".json,.html,.htm" hidden><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></body></html>
