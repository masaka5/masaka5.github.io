</head><body><div class="ops-shell"><header class="ops-header"><h1>文件夹分析器</h1><a class="back-link" href="../../">返回工具箱</a></header><main class="ops-main"><div class="actions"><button id="choose" class="primary">选择文件夹</button><button id="duplicate" class="secondary" disabled>检测重复</button><button id="cancel" class="secondary" disabled>取消</button><button id="export" class="secondary" disabled>导出 CSV</button><input id="fallback" type="file" webkitdirectory multiple hidden></div><p id="status" class="status" role="status" aria-live="polite">本地只读分析，文件不会上传。</p><div class="summary"><strong id="total">0 B</strong><span id="counts">0 个文件</span><span id="saved">重复冗余 0 B</span></div><section class="ops-panel analysis"><div class="filter-tabs" aria-label="分析视图"><button data-view="tree" aria-pressed="true">文件夹</button><button data-view="extension" aria-pressed="false">扩展名</button><button data-view="duplicate" aria-pressed="false">重复文件</button></div><div class="filters"><button id="up" class="secondary" disabled aria-label="上一级">↑</button><div id="crumbs" aria-label="当前位置"></div><input id="search" aria-label="搜索路径" placeholder="搜索路径"><select id="sort" aria-label="排序"><option value="size">大小降序</option><option value="count">数量降序</option><option value="name">名称顺序</option></select></div><canvas id="map" aria-label="文件大小分布；下方列表提供等价信息"></canvas><div class="table-wrap"><table><thead><tr><th id="name-head">名称 / 路径</th><th>大小</th><th>占比 / 数量</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" class="empty">选择文件夹，查看空间分布</p></div><div class="pager"><button id="prev">上一页</button><span id="page">0 / 0</span><button id="next">下一页</button></div></section></main><footer class="ops-footer"><span>逻辑大小 · 不含磁盘分配空间</span><span>只读 · 不提供删除</span></footer></div><script type="module" src="folder.js"></script></body></html>
