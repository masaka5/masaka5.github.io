<link rel="stylesheet" href="/assets/reference-tool-theme.css?v=20261116c"><script defer src="/assets/reference-tool-shell.js?v=20261116c"></script><script type="module" src="../../assets/tool-entry.mjs?v=20261120-stat1"></script></head><div class="folder-app" data-panel="analysis">
<header class="folder-header"><div class="brand-line"><a class="back-link" href="../../" aria-label="返回工具箱">← 工具箱</a><span class="brand-icon" aria-hidden="true"><i data-icon="folder-search"></i></span><div><h1>文件夹分析器</h1><p>空间分析 · 重复检测 · 批量处理</p></div></div><div class="header-state"><span class="status-dot"></span><span id="engineState">本地处理</span></div></header>
<main class="folder-main">
 <section class="toolbar-card">
  <div class="toolbar-actions"><button id="choose" class="primary"><i data-icon="folder-open"></i><span>选择文件夹</span></button><button id="batchChoose" class="secondary"><i data-icon="file-plus-2"></i><span>选择可编辑文件夹</span></button><button id="duplicate" class="secondary" disabled><i data-icon="file-check-2"></i><span>检测重复</span></button><button id="cancel" class="secondary" disabled>取消</button><button id="export" class="icon-button" disabled aria-label="导出 CSV" title="导出 CSV"><i data-icon="file-down"></i></button></div>
  <div class="panel-switch" role="tablist"><button class="active" role="tab" data-panel-tab="analysis" aria-selected="true">分析</button><button role="tab" data-panel-tab="batch" aria-selected="false">批处理</button></div>
 </section>
 <section class="summary-grid"><div class="metric"><span>总大小</span><strong id="total">0 B</strong></div><div class="metric"><span>文件</span><strong id="counts">0</strong></div><div class="metric"><span>重复冗余</span><strong id="saved">0 B</strong></div><div class="metric status-metric"><span>状态</span><p id="status" role="status" aria-live="polite">等待选择文件夹</p></div></section>
 <div class="folder-grid">
  <section class="analysis-card" aria-label="文件夹分析">
   <div class="card-head"><div><span class="eyebrow">分析</span><h2>空间分布</h2></div><div class="view-switch"><button data-view="tree" aria-pressed="true">目录</button><button data-view="extension" aria-pressed="false">类型</button><button data-view="duplicate" aria-pressed="false">重复</button></div></div>
   <div class="analysis-controls"><button id="up" class="icon-button" disabled aria-label="上一级"><i data-icon="arrow-up"></i></button><nav id="crumbs" class="crumbs" aria-label="当前位置"></nav><label class="search-field"><i data-icon="file-search"></i><input id="search" aria-label="搜索路径" placeholder="搜索当前目录"></label><select id="sort" aria-label="排序"><option value="size">大小</option><option value="count">数量</option><option value="name">名称</option></select></div>
   <canvas id="map" aria-label="文件大小分布"></canvas>
   <div class="table-wrap"><table><thead><tr><th class="check-col"></th><th id="name-head">名称 / 路径</th><th>大小</th><th>占比 / 数量</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty"><span class="empty-icon"><i data-icon="folder-open"></i></span><strong>选择文件夹开始分析</strong><small>文件仅在浏览器本地读取</small></div></div>
   <div class="analysis-footer"><span id="selectionHint">未选择文件</span><div class="pager"><button id="prev" class="pager-button" aria-label="上一页"><i data-icon="chevron-left"></i></button><span id="page">0 / 0</span><button id="next" class="pager-button" aria-label="下一页"><i data-icon="chevron-right"></i></button></div></div>
  </section>
  <aside class="batch-card" aria-label="批量处理">
   <div class="card-head"><div><span class="eyebrow">批处理</span><h2>批量任务</h2></div><span id="batchCapability" class="soft-badge">只读</span></div>
   <p id="batchHint" class="panel-note">选择可编辑文件夹，或导入文件后下载 ZIP。</p><button id="batchChoosePanel" class="secondary wide">选择可编辑文件夹</button>
   <div class="batch-selection"><span id="batchSelection">未选择文件</span><button id="selectCurrent" class="text-button" type="button">选择当前目录</button></div>
   <div class="batch-tabs" role="tablist"><button class="active" role="tab" data-batch-tab="rename" aria-selected="true">批量重命名</button><button role="tab" data-batch-tab="convert" aria-selected="false">格式转换</button></div>
   <section class="batch-form" data-batch-panel="rename">
    <div class="batch-fields"><label><span>前缀</span><input id="renamePrefix" placeholder="可选" maxlength="60"></label><label><span>后缀</span><input id="renameSuffix" placeholder="可选" maxlength="60"></label><label><span>查找</span><input id="renameFind" placeholder="可选" maxlength="80"></label><label><span>替换为</span><input id="renameReplace" placeholder="可选" maxlength="80"></label><label><span>编号起点</span><input id="renameStart" type="number" min="0" value="1"></label><label><span>编号</span><select id="renameNumber"><option value="off">关闭</option><option value="suffix">追加</option><option value="prefix">前置</option></select></label></div>
    <label class="check-row"><input id="renameOverwrite" type="checkbox"><span>允许覆盖同名文件</span></label><button id="applyRename" class="primary wide" disabled>执行重命名</button>
   </section>
   <section class="batch-form" data-batch-panel="convert" hidden>
    <div class="batch-fields"><label><span>目标格式</span><select id="convertFormat"><option value="webp">WebP</option><option value="jpeg">JPEG</option><option value="png">PNG</option><option value="json">JSON</option><option value="csv">CSV</option></select></label><label><span>最长边</span><input id="convertMaxEdge" type="number" min="0" max="8192" placeholder="保持"></label><label><span>质量</span><input id="convertQuality" type="range" min="45" max="100" value="88"></label><label><span>文件名后缀</span><input id="convertSuffix" value="-转换" maxlength="40"></label></div>
    <label class="check-row"><input id="convertOverwrite" type="checkbox"><span>覆盖原文件</span></label><button id="applyConvert" class="primary wide" disabled>执行转换</button>
   </section>
   <div class="batch-preview"><div class="preview-head"><span>预览</span><small id="previewCount">0 项</small></div><ol id="batchPreview"><li>勾选文件后显示处理结果</li></ol></div>
   <a id="batchDownload" class="secondary wide" hidden download>下载处理结果 ZIP</a>
  </aside>
 </div>
</main>
<input id="fallback" type="file" webkitdirectory multiple hidden>
<footer class="folder-footer"><span>逻辑大小 · 不含磁盘分配空间</span><span>原始文件仅在确认后写入</span></footer>
