<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Windows 错误码 · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"/><link rel="stylesheet" href="../../assets/ops.css"/><script defer src="../../assets/windows-errors-data.js"></script><script defer src="../../assets/windows-errors-core.js"></script><script defer src="../../assets/ops-ui.js"></script><script defer src="../../assets/ops-tools.js"></script></head>
<body data-tool="windows-errors" data-view="input"><div class="ops-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>Windows 错误码</h1><span></span></header><main class="ops-main"><nav class="workspace-tabs" aria-label="工具视图"><button data-view-target="input" aria-pressed="true">查询</button><button data-view-target="result" aria-pressed="false">结果</button></nav><div class="ops-workspace"><section class="ops-panel" data-pane="input"><h2>离线查询</h2><form id="toolForm"><label class="field"><span>错误码、名称或中文关键词</span><input id="query" value="0x80070005" placeholder="0x80070005 / 拒绝访问" autocomplete="off" maxlength="200"/></label><label class="field" style="margin-top:14px"><span>代码类型</span><select id="family"><option value="all">全部</option><option value="Win32">Win32 / Winsock</option><option value="HRESULT">HRESULT</option><option value="NTSTATUS">NTSTATUS</option><option value="BugCheck">蓝屏停止代码</option></select></label><div class="actions" style="margin-top:16px"><button class="primary" type="submit">查询</button></div></form><div class="samples"><button data-query="0x80070005">拒绝访问</button><button data-query="10054">连接重置</button><button data-query="0xC0000005">访问冲突</button><button data-query="0x7B" data-family="BugCheck">蓝屏 0x7B</button></div><p id="toolStatus" class="status" role="status"></p><p class="help">接受十六进制、十进制及有符号 HRESULT。相同数值可能属于不同代码类型。</p></section><section class="ops-panel" data-pane="result"><div class="panel-head"><h2>查询结果</h2><span id="resultCount"></span></div><div class="result-list" id="errorResults"></div><div class="pager" id="errorPager"></div></section></div></main><footer class="ops-footer"><span id="dataCount"></span><span>常见代码提供中文说明</span></footer></div></body></html>
