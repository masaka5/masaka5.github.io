<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fa"><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="breeze-tts.css"><script defer src="../../assets/ops-ui.js"></script><script type="module" src="breeze-tts.js"></script><title>语音工作室 · 口袋工具箱</title><meta name="description" content="Breeze TTS 2 3B 浏览器本地语音合成，支持声音设计、音色复刻和中英文语音。"><link rel="canonical" href="https://tools.manshii.asia/tools/breeze-tts/"></head><body><div class="breeze-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>语音工作室</h1><span class="engine-badge">Breeze TTS 2 · Q4</span></header><main class="breeze-main"><section class="breeze-card model-card"><div class="card-title"><div><h2>本地模型</h2><p id="modelState">首次使用下载约 2.54 GB</p></div><span id="modelStatus" class="status-dot" data-state="idle"></span></div><div class="progress-track"><i id="modelProgress"></i></div><div class="model-actions"><button id="loadModel" class="primary">加载模型</button><button id="clearModel" class="secondary" disabled>清除缓存</button><span id="modelDetail" class="muted"></span></div><p class="license-note">模型及衍生输出仅限研究和非商业使用。</p></section><section class="breeze-card compose-card"><div class="card-title"><div><h2>生成语音</h2><p id="readyState">加载模型后可开始</p></div><select id="language" aria-label="语言"><option value="zh">中文</option><option value="en">English</option></select></div><textarea id="text" rows="5" maxlength="8000" placeholder="输入要朗读的文字"></textarea><div class="field-row"><label>声音指令<input id="instruction" placeholder="例如：温柔、清晰、自然地说"></label><label>参考音频（可选）<input id="reference" type="file" accept="audio/*"></label></div><label class="ref-label">参考音频文字（使用音色复刻时填写）<input id="refText" placeholder="准确写出参考音频中的文字"></label><div class="compose-actions"><button id="generate" class="primary" disabled>生成语音</button><button id="stop" class="secondary" hidden>停止</button><button id="download" class="secondary" disabled>下载 WAV</button><span id="generateStatus" class="muted"></span></div><audio id="player" controls></audio></section></main><p id="pageStatus" class="page-status" role="status"></p></div></body></html>
