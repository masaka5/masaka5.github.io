<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="浏览器中的 PowerShell 7 IDE：编辑、运行真实 Linux PowerShell 脚本，支持中文、交互终端与本机草稿。"><title>PowerShell 7 IDE · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/design-system.css"><link rel="stylesheet" href="../../vendor/xterm/xterm.css"><link rel="stylesheet" href="app.css"><script defer src="../../vendor/xterm/xterm.js"></script><script defer src="../../vendor/xterm/addon-fit.js"></script><script defer src="../../vendor/xterm/addon-unicode11.js"></script><script defer src="../webvm/vm-core.js"></script><script type="module" src="app.js"></script></head><body>
<div class="ide-shell" id="ideShell" data-panel="editor"><header><a href="../../" class="back">← 工具箱</a><h1>PowerShell 7 IDE</h1><span class="runtime-state" id="runtimeState" data-state="idle">未启动</span></header>
<nav class="toolbar" aria-label="脚本操作"><div><button id="newFile">新建</button><button id="importFile">导入</button><button id="exportFile">导出 .ps1</button><input type="file" id="fileInput" accept=".ps1,text/plain" hidden></div><div><button id="runAll" class="primary">运行全部</button><button id="runSelection">运行选择</button><button id="stopRun" disabled>停止</button><button id="resetRuntime" disabled>重置环境</button></div></nav>
<nav class="mobile-tabs" aria-label="工作区域"><button data-panel="editor" aria-pressed="true">脚本</button><button data-panel="terminal" aria-pressed="false">终端</button></nav>
<main><section class="editor-panel" aria-label="脚本编辑"><div class="panel-head"><label for="fileName" class="sr-only">脚本文件名</label><input id="fileName" value="脚本.ps1" spellcheck="false" maxlength="200"><span id="draftState">自动保存到本机</span></div><div id="editor"></div><div class="editor-foot"><span id="cursorState">行 1，列 1</span><span>Ctrl+Enter 运行 · 选择后运行选择</span></div></section>
<section class="terminal-panel" aria-label="PowerShell 交互终端"><div class="panel-head"><strong>终端</strong><span class="runtime-label">Linux · PowerShell 7</span><button id="startRuntime">启动环境</button><button id="clearTerminal">清屏</button></div><div id="terminalBody"><div id="terminal"></div><div class="terminal-welcome" id="welcome"><span class="ps-glyph" aria-hidden="true">&gt;_</span><p>运行脚本，或启动交互终端</p><small>首次加载约 129 MB，运行速度取决于设备。<br>Linux 版 PowerShell，不含 Windows 专用命令。</small></div><div id="bootProgress" hidden><progress></progress><span id="bootLabel">正在加载…</span></div></div><div class="terminal-keys"><button data-key="\u0003" disabled>Ctrl+C</button><button data-key="\u001b[A" disabled aria-label="上一条命令">↑</button><button data-key="\u001b[B" disabled aria-label="下一条命令">↓</button><button data-key="\t" disabled>Tab</button><button data-key="\r" disabled>Enter</button></div><form id="terminalForm"><label for="terminalInput" class="sr-only">终端输入</label><input id="terminalInput" placeholder="输入命令或交互内容，回车发送" spellcheck="false" autocomplete="off" disabled><button id="sendInput" disabled>发送</button></form></section></main>
<footer><span id="status" role="status" aria-live="polite">草稿保留在当前浏览器；脚本在浏览器内运行。</span><span>UTF-8</span></footer></div>
<div hidden id="screen_container"><div></div><canvas></canvas></div><dialog id="confirmDialog"><form method="dialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="dialog-actions"><button value="cancel">取消</button><button value="confirm" class="primary">继续</button></div></form></dialog>
</body></html>
