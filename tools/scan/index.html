<body>
  <div class="studio-shell">
    <header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>条码与二维码</h1><span class="pill" id="scanCount">0 条</span></header>
    <main class="studio-main">
      <aside class="studio-controls">
        <h2>扫码设置</h2>
        <label class="field"><span>输入来源</span><select id="scanMode"><option value="camera">摄像头</option><option value="image">图片文件</option><option value="keyboard">扫码枪／键盘</option></select></label>
        <label class="field" id="cameraField"><span>摄像头</span><select id="cameraSelect"><option value="">后置／默认摄像头</option></select></label>
        <div class="actions"><button id="startScan" class="primary" type="button">开始扫描</button><button id="stopScan" class="secondary" type="button" disabled>停止</button><button id="selectImage" class="secondary" type="button">选图片</button><input id="imageFile" type="file" accept="image/*" multiple hidden></div>
        <label class="field"><span>结果分隔符</span><select id="scanSeparator"><option value="space" selected>空格</option><option value="newline">换行</option><option value="tab">Tab</option><option value="none">不追加</option></select></label>
        <label class="check"><input id="deduplicate" type="checkbox" checked>画面去重</label>
        <label class="check"><input id="scanSound" type="checkbox" checked>提示音</label>
        <label class="field" id="wedgeField" hidden><span>扫码枪输入</span><input id="wedgeInput" placeholder="点这里接收扫码枪" autocomplete="off"></label>
        <p id="scanStatus" class="status" role="status" aria-live="polite">支持摄像头、图片和扫码枪。</p>
        <p class="help">识别常用二维码和条形码，内容仅在本机处理。</p>
      </aside>
      <section class="studio-stage scan-stage">
        <div class="media-frame" id="scanFrame"><video id="scanVideo" muted autoplay playsinline></video><p id="scanPlaceholder">开启摄像头，或选择图片</p></div>
        <div class="panel-head"><h2>扫码结果</h2><div class="actions"><button class="text-button" id="copyScans" type="button">复制</button><button class="text-button" id="saveScans" type="button">下载</button><button class="text-button" id="clearScans" type="button">清空</button></div></div>
        <textarea id="scanOutput" class="studio-output" aria-label="扫码结果" placeholder="识别结果会按所选间隔追加"></textarea>
        <div class="scan-history" id="scanHistory" aria-label="最近扫描"></div>
      </section>
    </main>
    <footer class="studio-footer"><span>图片本机识别，不会打开码内链接</span><span>手机摄像头需要 HTTPS</span></footer>
  </div>
</body>
