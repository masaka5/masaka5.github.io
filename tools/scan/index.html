<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>条码扫描 · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="../../assets/studio.css"><script defer src="../../assets/ops-ui.js"></script><script defer src="../../vendor/zxing/reader.js"></script><script defer src="scan.js"></script></head><body><div class="studio-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>条码扫描</h1><span class="pill" id="scanCount">0 条</span></header><main class="studio-main"><aside class="studio-controls"><h2>连续扫码</h2><label class="field"><span>输入来源</span><select id="scanMode"><option value="camera">摄像头</option><option value="image">图片文件</option><option value="keyboard">扫码枪／键盘</option></select></label><label class="field" id="cameraField"><span>摄像头</span><select id="cameraSelect"><option value="">后置／默认摄像头</option></select></label><div class="actions"><button id="startScan" class="primary">开始扫描</button><button id="stopScan" class="secondary" disabled>停止</button><button id="selectImage" class="secondary">选择图片</button><input id="imageFile" type="file" accept="image/*" multiple hidden></div><label class="field"><span>每次扫码后添加</span><select id="scanSeparator"><option value="space" selected>空格</option><option value="newline">换行</option><option value="tab">制表符</option><option value="none">不添加</option></select></label><label class="check"><input id="deduplicate" type="checkbox" checked>同一码在画面内只录入一次</label><label class="check"><input id="scanSound" type="checkbox" checked>成功提示音</label><label class="field" id="wedgeField" hidden><span>扫码枪输入（回车自动收录）</span><input id="wedgeInput" placeholder="点击这里，再使用扫码枪" autocomplete="off"></label><p id="scanStatus" class="status" role="status">支持摄像头、图片与扫码枪输入。</p><p class="help">支持 QR、Micro QR、rMQR、Data Matrix、PDF417、Aztec、MaxiCode、Code 39/93/128、EAN、UPC、ITF、Codabar、DataBar 等。解码在本机完成。</p></aside><section class="studio-stage"><div class="media-frame" id="scanFrame"><video id="scanVideo" muted autoplay playsinline></video><p id="scanPlaceholder">开启摄像头，或选择包含条码的图片</p></div><div class="panel-head"><h2>扫码结果</h2><div class="actions"><button class="text-button" id="copyScans">复制</button><button class="text-button" id="saveScans">下载</button><button class="text-button" id="clearScans">清空</button></div></div><textarea id="scanOutput" class="studio-output" aria-label="扫码结果" placeholder="连续扫码结果，按所选分隔符自动追加"></textarea><div class="scan-history" id="scanHistory" aria-label="最近扫描"></div></section></main><footer class="studio-footer"><span>图片不上传 · 不会自动打开码内链接</span><span>扫码枪只输入本站，不能控制其他软件</span></footer></div></body></html>
