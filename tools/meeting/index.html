<body>
<div class="meeting-shell" id="meetingShell">
 <header class="meeting-header"><div class="header-brand"><a class="back-link" href="../../">← 工具箱</a><h1>在线会议</h1></div><div class="header-actions"><span class="connection-status" id="connectionStatus" role="status">准备就绪</span><button class="icon-button" id="openSettings" aria-label="会议设置" title="会议设置"><i data-icon="settings-2"></i></button></div></header>
 <main id="meetingLobby" class="meeting-lobby">
  <section class="lobby-preview" aria-label="入会预览"><div class="preview-stage"><video id="localPreview" autoplay muted playsinline hidden></video><div class="preview-placeholder" id="previewPlaceholder"><div class="avatar" id="previewAvatar">我</div></div><span class="preview-name" id="previewName">我的预览</span></div><div class="preview-controls"><button class="media-control" id="previewMic" aria-pressed="false"><i data-icon="mic-off"></i><span>麦克风关闭</span></button><button class="media-control" id="previewCamera" aria-pressed="false"><i data-icon="video-off"></i><span>摄像头关闭</span></button></div></section>
  <section class="lobby-form"><div><h2 id="lobbyTitle">开始会议</h2></div><label class="field"><span>姓名</span><input id="displayName" maxlength="24" placeholder="输入姓名" autocomplete="nickname"></label><div class="join-actions"><button class="primary" id="createMeeting"><i data-icon="video"></i>发起会议</button><button class="primary" id="joinMeeting" hidden><i data-icon="log-in"></i>加入会议</button></div><div class="join-divider"><span>加入已有会议</span></div><form id="joinForm" class="join-form"><label class="sr-only" for="inviteInput">邀请链接或房间码</label><input id="inviteInput" placeholder="邀请链接或房间码" autocomplete="off" spellcheck="false"><button class="secondary" type="submit" aria-label="使用邀请链接加入"><i data-icon="arrow-right"></i></button></form><p class="status" id="lobbyStatus" role="status"></p></section>
 </main>
 <main id="meetingRoom" class="meeting-room" hidden>
  <div class="room-heading"><div><h2 id="roomTitle">会议室</h2><span id="meetingTime" class="meeting-time">00:00</span><span class="participant-count" id="participantCount">1 人</span></div><div class="room-actions"><button class="secondary" id="copyInvite"><i data-icon="link"></i><span>邀请</span></button><button class="icon-button" id="toggleLayout" aria-label="切换网格或演示布局" title="切换布局"><i data-icon="layout-grid"></i></button><button class="icon-button" id="openPeople" aria-label="参会成员" title="参会成员"><i data-icon="users-round"></i></button></div></div>
  <div class="room-workspace" id="roomWorkspace"><section class="stage-area" id="videoStage" aria-label="会议画面"><div class="video-grid" id="videoGrid"></div><div class="stage-pagination" id="stagePagination" hidden><button class="icon-button" id="prevTile" aria-label="上一组画面"><i data-icon="chevron-left"></i></button><span id="tilePage"></span><button class="icon-button" id="nextTile" aria-label="下一组画面"><i data-icon="chevron-right"></i></button></div><div class="waiting-hint" id="waitingHint"><button class="text-button" id="inviteFromEmpty">复制邀请链接</button></div></section><section class="meeting-whiteboard" id="meetingWhiteboard" aria-label="会议白板" hidden></section>
   <aside class="conversation-panel" id="conversationPanel" hidden><div class="conversation-head"><div role="tablist" aria-label="会议侧栏"><button id="chatTab" role="tab" aria-selected="true">聊天</button><button id="peopleTab" role="tab" aria-selected="false">成员</button></div><button class="icon-button" id="closePanel" aria-label="关闭侧栏"><i data-icon="x"></i></button></div><section class="chat-content" id="chatContent"><div class="chat-messages" id="chatMessages" role="log" aria-label="会议消息" aria-live="polite"><p class="chat-empty" id="chatEmpty">消息仅在本次会议中显示</p></div><form id="chatForm" class="chat-form"><label class="sr-only" for="chatText">消息</label><textarea id="chatText" rows="2" maxlength="2000" placeholder="发送消息…"></textarea><div><span id="chatStatus" class="status" role="status"></span><button class="primary" id="sendChat" type="submit" aria-label="发送消息"><i data-icon="send"></i></button></div></form></section><section class="people-content" id="peopleContent" hidden><ul id="peopleList"></ul></section></aside>
  </div>
  <div class="call-controls"><div class="controls-spacer"><button class="secondary" id="enableSound" hidden><i data-icon="volume-2"></i>开启声音</button></div><div class="main-controls"><button class="call-button" id="toggleMic" aria-pressed="false"><i data-icon="mic-off"></i><span>麦克风</span></button><button class="call-button" id="toggleCamera" aria-pressed="false"><i data-icon="video-off"></i><span>摄像头</span></button><button class="call-button" id="shareScreen" aria-pressed="false"><i data-icon="screen-share"></i><span>共享屏幕</span></button><button class="call-button" id="openWhiteboard" aria-pressed="false"><i data-icon="presentation"></i><span>白板</span></button><button class="call-button" id="openChat" aria-pressed="false"><i data-icon="message-square"></i><span>聊天</span><b class="unread-dot" id="unreadDot" hidden></b></button><span class="control-divider"></span><button class="call-button leave-button" id="leaveMeeting"><i data-icon="phone-off"></i><span>离开</span></button></div><div class="controls-spacer end"><span class="direct-label">浏览器直连</span></div></div>
 </main>
 <footer class="meeting-footer"><p id="meetingNotice" role="status" aria-live="polite"></p><button class="text-button" id="openDiagnostics">连接</button></footer>
</div>
<div id="remoteAudio" hidden></div>
<dialog id="settingsDialog"><form id="settingsForm"><div class="panel-head"><h2>会议设置</h2><button class="icon-button" type="button" data-close aria-label="关闭设置"><i data-icon="x"></i></button></div><label class="field"><span>连接方式</span><select id="relayStrategy"><option value="mqtt">公共 MQTT</option><option value="nostr">公共 Nostr</option></select></label><p class="settings-note" id="strategyNote">更换后需重新发送邀请链接。</p><div class="row"><label class="field"><span>麦克风</span><select id="micDevice"><option value="">默认设备</option></select></label><label class="field"><span>摄像头</span><select id="cameraDevice"><option value="">默认设备</option></select></label></div><details><summary>连接中继</summary><p class="settings-note">复杂网络可配置 TURN。仅本页保留，不包含在邀请链接中；需重新入会生效。</p><label class="field"><span>TURN 地址</span><input id="turnURL" placeholder="turn:example.com:3478" autocomplete="off" spellcheck="false"></label><div class="row"><label class="field"><span>用户名</span><input id="turnUser" autocomplete="off"></label><label class="field"><span>密码</span><input id="turnPassword" type="password" autocomplete="off"></label></div></details><p class="status" id="settingsStatus" role="status"></p><div class="dialog-actions"><button class="primary">保存</button></div></form></dialog>
<dialog id="diagnosticsDialog"><div class="panel-head"><h2>连接详情</h2><button class="icon-button" data-close aria-label="关闭连接详情"><i data-icon="x"></i></button></div><dl class="diagnostics-list" id="diagnosticsList"></dl><p class="settings-note">使用公共信令与 STUN 服务。无法直连时可配置 TURN；网络限制可能影响入会。</p><a href="../../vendor/meeting/SOURCE.txt" class="text-button" target="_blank" rel="noopener">开源组件</a></dialog>
<noscript>请启用 JavaScript 使用在线会议。</noscript>
</body></html>
