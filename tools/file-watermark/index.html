</head><body><div class="watermark-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>文件隐写与校验</h1><span>本机处理</span></header><main><section class="input-panel"><nav class="network-tabs"><button data-mode="embed" aria-pressed="true">写入</button><button data-mode="verify" aria-pressed="false">校验</button></nav><label class="drop-area"><input id="file" type="file"><strong id="fileName">选择文件</strong><span id="fileInfo">PNG · JPEG · PDF · Office · ZIP</span></label><div id="embedSettings"><label class="field"><span>水印内容</span><textarea id="label" maxlength="2000" placeholder="姓名、编号或备注" spellcheck="false"></textarea></label><label class="field"><span>保存方式</span><select id="storageMode"><option value="embed">嵌入文件</option><option value="certificate">独立校验文件（任意格式）</option></select></label></div><label id="certificateField" class="field" hidden><span>独立校验文件（可选）</span><input id="certificate" type="file" accept=".json,application/json"></label><label class="field"><span>认证口令（可选）</span><input id="password" type="password" autocomplete="off" placeholder="填写后使用 HMAC 认证"></label><button id="run" class="primary">写入并下载</button><p id="status" class="status" role="status"></p></section><section class="result-panel"><div class="panel-head"><h2>校验结果</h2><button id="restore" class="text-button" hidden>下载还原文件</button></div><div id="empty" class="empty">选择文件后写入或校验</div><dl id="results" hidden></dl><p class="note">标记不改变可见内容，可被清除。未设口令时仅校验一致性，不证明来源。</p></section></main></div><script type="module" src="watermark.js"></script></body></html>
