<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><meta name="description" content="WASM 十六进制文件分析器，支持十六进制查看、搜索、字段解析、校验和与文件导出。"><title>十六进制分析 · 口袋工具箱</title><link rel="canonical" href="https://tools.manshii.asia/catalog/hex-wasm/"><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="hex.css"><script defer src="../../assets/ops-ui.js"></script><script type="module" src="hex.js?v=20261114"></script></head><body><div class="hex-shell"><header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>十六进制分析</h1><span class="engine-pill">WASM · 本地处理</span></header><main><section class="file-panel"><div class="file-actions"><button class="primary" id="open">打开文件</button><button class="secondary" id="dropHint">拖入文件</button><input id="file" type="file" hidden><span id="fileName">尚未选择文件</span></div><div class="stats" id="stats"><span>大小 <b>—</b></span><span>字节 <b>—</b></span><span>CRC32 <b>—</b></span><span>熵 <b>—</b></span></div><div class="search-row"><input id="search" placeholder="搜索十六进制，如 FF D8 FF，或文本"><select id="searchMode"><option value="hex">十六进制</option><option value="text">文本</option></select><button class="secondary" id="find">查找</button><span id="matches"></span></div><div class="hex-view" id="hexView"><div class="empty">打开文件后显示偏移、十六进制和 ASCII</div></div></section><aside class="inspector"><div class="panel-tabs"><button class="active" data-tab="decode">字段解析</button><button data-tab="strings">文本提取</button></div><div id="decodePanel" class="tab-panel"><label>偏移<input id="offset" type="number" min="0" value="0"></label><label>长度<input id="length" type="number" min="1" value="1"></label><label>字节序<select id="endian"><option value="little">小端</option><option value="big">大端</option></select></label><div class="decode-values" id="decodeValues"><span>无数据</span></div><button class="secondary full" id="copyHex">复制所选十六进制</button></div><div id="stringsPanel" class="tab-panel" hidden><div class="string-toolbar"><label>最短长度<input id="minString" type="number" min="3" max="100" value="4"></label><button class="secondary" id="extract">提取</button></div><div id="stringList" class="string-list"><span class="muted">打开文件后提取可见文本</span></div></div><div class="analysis-card"><strong>文件分析</strong><div id="fileType">—</div><div id="entropy">高熵数据通常是压缩或加密内容</div></div></aside></main><footer class="ai-footer"><span id="status">支持拖放 · 搜索 · 字段解析 · 校验</span><span>单文件上限 512 MB</span></footer></div></body></html>
