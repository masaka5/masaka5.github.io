<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <link rel="icon" href="../../assets/favicon.svg">
  <link rel="stylesheet" href="../../assets/design-system.css">
  <link rel="stylesheet" href="../../assets/reference-tool-theme.css?v=20261119">
  <link rel="stylesheet" href="resume.css?v=20261120c">
  <script defer src="resume.js?v=20261120d"></script>
  <title>简历生成器 · 口袋工具箱</title>
  <meta name="description" content="本地 AI 简历编辑器：需求生成、AI 润色、多模板、实时预览、自动保存与 PDF 导出。">
  <link rel="canonical" href="https://tools.manshii.asia/catalog/resume/">
  <meta name="robots" content="index,follow,max-image-preview:large">
</head>
<body>
<svg class="sprite" aria-hidden="true"><symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6zM14 2v5h5M9 12h6M9 16h6"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M5 20h14"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M5 21h14"/></symbol><symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7z"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h9a6 6 0 0 1 6 6"/></symbol><symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12h-9a6 6 0 0 0-6 6"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4-1 11-11-3-3L5 16zM14 6l3 3"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol><symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol><symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m4 18 5-5 4 4 3-3 4 4"/></symbol><symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4zM18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8zM5 3l.6 1.4L7 5l-1.4.6L5 7l-.6-1.4L3 5l1.4-.6z"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></symbol></svg>

<div class="resume-app">
  <header class="app-header">
    <a class="back-link" href="../../" aria-label="返回工具箱">← 工具箱</a>
    <div class="brand"><span class="brand-mark"><svg><use href="#i-file"/></svg></span><div><h1>简历生成器</h1><small id="saveState">本地自动保存</small></div></div>
    <div class="header-actions">
      <button class="secondary-button compact ai-trigger" id="openAi" type="button" aria-label="本地 AI" aria-haspopup="dialog"><svg><use href="#i-sparkles"/></svg><span>本地 AI</span></button><div class="history-actions"><button class="icon-button" id="undo" type="button" aria-label="撤销" title="撤销"><svg><use href="#i-undo"/></svg></button><button class="icon-button" id="redo" type="button" aria-label="重做" title="重做"><svg><use href="#i-redo"/></svg></button></div>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
      <input id="photoFile" type="file" accept="image/*" hidden>
      <button class="secondary-button compact" id="importButton" type="button">导入</button>
      <button class="secondary-button compact" id="exportJson" type="button">备份</button>
      <button class="secondary-button compact" id="printButton" type="button"><svg><use href="#i-print"/></svg>打印</button>
      <button class="primary-button compact" id="exportPdf" type="button"><svg><use href="#i-download"/></svg>PDF</button>
      <button class="icon-button mobile-toggle" id="mobileToggle" type="button" aria-label="切换编辑与预览"><svg><use href="#i-eye"/></svg></button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <aside class="editor-panel" id="editorPanel">
      <div class="editor-tabs" role="tablist"><button type="button" role="tab" data-editor-tab="content" aria-selected="true">内容</button><button type="button" role="tab" data-editor-tab="design" aria-selected="false">设计</button></div>
      <div class="editor-scroll">
        <section id="contentPanel" class="editor-section">
          <div class="profile-card">
            <button class="photo-button" id="pickPhoto" type="button"><img id="photoPreview" alt=""><span id="photoPlaceholder"><svg><use href="#i-image"/></svg>头像</span></button>
            <div class="profile-fields">
              <label class="field"><span>姓名</span><input data-profile="name" maxlength="40" placeholder="姓名"></label>
              <label class="field"><span>目标职位</span><input data-profile="role" maxlength="80" placeholder="产品工程师"></label>
              <label class="field"><span>手机</span><input data-profile="phone" maxlength="40" placeholder="138 0000 0000"></label>
              <label class="field"><span>邮箱</span><input data-profile="email" type="email" maxlength="100" placeholder="name@example.com"></label>
              <label class="field"><span>城市</span><input data-profile="location" maxlength="60" placeholder="上海"></label>
              <label class="field"><span>主页</span><input data-profile="website" maxlength="160" placeholder="个人主页 / GitHub"></label>
            </div>
          </div>
          <div class="format-toolbar" aria-label="文本格式"><button type="button" data-format="bold" title="加粗">B</button><button type="button" data-format="italic" title="斜体"><i>I</i></button><button type="button" data-format="highlight" title="高亮">H</button><button type="button" data-format="code" title="行内代码">&lt;/&gt;</button><button type="button" data-format="bullet" title="项目列表">•</button><button type="button" data-format="number" title="编号列表">1.</button><button type="button" data-format="quote" title="引用">“</button><button class="format-ai" type="button" data-ai-polish title="用本地 AI 润色当前内容"><svg><use href="#i-sparkles"/></svg>润色</button></div>
          <div class="section-head"><h2>简历栏目</h2><span id="sectionCount"></span></div>
          <div id="sectionList" class="section-list"></div>
          <div class="add-section"><span>添加栏目</span><div id="sectionPresets"></div></div>
          <button class="text-danger" id="resetResume" type="button">清空并恢复示例</button>
        </section>

        <section id="designPanel" class="editor-section" hidden>
          <div class="setting-block"><div class="block-title">模板</div><div class="template-grid" id="templateGrid"></div></div>
          <div class="setting-block"><div class="block-title">主题色</div><div class="swatches" id="accentSwatches"></div></div>
          <div class="setting-block form-grid">
            <label class="field"><span>字体</span><select id="fontFamily"><option value="sans">现代无衬线</option><option value="serif">衬线正文</option><option value="mono">技术风格</option></select></label>
            <label class="field"><span>纸张</span><select id="pageSize"><option value="a4">A4</option><option value="letter">Letter</option></select></label>
            <label class="field"><span>行距 <b id="lineHeightValue">1.55</b></span><input id="lineHeight" type="range" min="1.25" max="1.9" step=".05"></label>
            <label class="field"><span>区块间距 <b id="spacingValue">18</b></span><input id="spacing" type="range" min="10" max="30" step="1"></label>
          </div>
          <label class="setting-row"><span>显示头像</span><input id="showPhoto" type="checkbox" role="switch"></label>
          <label class="setting-row"><span>紧凑打印</span><input id="compact" type="checkbox" role="switch"></label>
        </section>
      </div>
    </aside>

    <section class="preview-panel">
      <div class="preview-toolbar"><div><strong>实时预览</strong><span id="pageMeta">A4 · 1 页</span></div><div class="preview-actions"><button class="icon-button" id="zoomOut" type="button" aria-label="缩小">−</button><span id="zoomValue">80%</span><button class="icon-button" id="zoomIn" type="button" aria-label="放大">+</button><button class="secondary-button compact" id="fitPreview" type="button">适应</button></div></div>
      <div class="preview-scroll" id="previewScroll"><article class="resume-page" id="resumePage" aria-label="简历预览"></article></div>
      <div class="status-toast" id="statusToast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <dialog class="ai-dialog" id="aiDialog" aria-labelledby="aiTitle">
    <div class="ai-shell">
      <header class="ai-head"><div><small>浏览器本地模型</small><h2 id="aiTitle">简历助手</h2></div><button class="icon-button" id="closeAi" type="button" aria-label="关闭 AI"><span aria-hidden="true">×</span></button></header>
      <div class="ai-model-state" id="aiModelBox"><span class="ai-model-dot" id="aiModelDot" aria-hidden="true"></span><span id="aiModelState">模型未加载</span><button class="text-button" id="aiModelAction" type="button">加载模型</button></div>
      <div class="ai-tabs" role="tablist"><button id="aiGenerateTab" type="button" role="tab" aria-selected="true" data-ai-tab="generate">需求生成</button><button id="aiPolishTab" type="button" role="tab" aria-selected="false" data-ai-tab="polish">AI 润色</button></div>
      <div class="ai-body">
        <section id="aiGeneratePanel" class="ai-panel" role="tabpanel" aria-labelledby="aiGenerateTab">
          <label class="ai-field"><span>需求</span><textarea id="aiRequirement" maxlength="12000" placeholder="输入岗位、经历、技能、项目和求职要求"></textarea></label>
          <button class="primary-button ai-run" id="aiGenerate" type="button"><svg><use href="#i-sparkles"/></svg>生成简历</button>
        </section>
        <section id="aiPolishPanel" class="ai-panel" role="tabpanel" aria-labelledby="aiPolishTab" hidden>
          <label class="ai-field"><span>目标</span><select id="aiPolishTarget"></select></label>
          <label class="ai-field"><span>方向</span><select id="aiPolishStyle"><option>专业</option><option>简洁</option><option>成果</option><option>技术</option></select></label>
          <label class="ai-field"><span>原文</span><textarea id="aiPolishSource" maxlength="12000"></textarea></label>
          <button class="primary-button ai-run" id="aiPolish" type="button"><svg><use href="#i-sparkles"/></svg>开始润色</button>
        </section>
      </div>
      <div class="ai-progress" id="aiProgress" hidden><div><span id="aiProgressLabel">准备模型</span><b id="aiProgressValue">0%</b></div><progress id="aiProgressBar" max="100" value="0"></progress><button class="text-button danger" id="aiStop" type="button">停止</button></div>
      <section class="ai-result" id="aiResult" hidden><div class="ai-result-head"><strong id="aiResultTitle">生成结果</strong><span id="aiResultMeta"></span></div><p id="aiResultSummary"></p><div id="aiResultSections" class="ai-result-sections"></div><textarea id="aiResultText" maxlength="12000" readonly hidden></textarea><div class="ai-result-actions"><button class="text-button" id="aiDiscard" type="button">放弃</button><button class="primary-button" id="aiApply" type="button">填入简历</button></div></section>
      <p class="ai-status" id="aiStatus" role="status" aria-live="polite"></p>
    </div>
  </dialog>
</div>
</body>
</html>
