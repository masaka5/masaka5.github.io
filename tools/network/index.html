<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>网络测速与访问延迟 · 工具箱</title>
  <link rel="icon" href="../../assets/favicon.svg" />
  <link rel="stylesheet" href="../../assets/ops.css" />
  <script defer src="../../assets/ops-ui.js"></script>
  <script defer src="../../assets/network-core.js"></script>
  <script defer src="../../vendor/librespeed/speedtest.js"></script>
  <script defer src="librespeed.js"></script>
  <script defer src="network.js"></script>
</head>
<body data-view="input">
  <div class="ops-shell">
    <header class="ops-header"><a class="back-link" href="../../">← 工具箱</a><h1>网络检测</h1><span></span></header>
    <main class="ops-main">
      <nav class="network-tabs" aria-label="检测类型"><button data-network-view="speed" aria-pressed="true">带宽测速</button><button data-network-view="latency" aria-pressed="false">访问延迟</button></nav>
      <nav class="workspace-tabs" aria-label="工具视图"><button data-view-target="input" aria-pressed="true">设置</button><button data-view-target="result" aria-pressed="false">结果</button></nav>
      <div class="ops-workspace" id="speedView">
        <section class="ops-panel" data-pane="input">
          <h2>测速节点</h2>
          <label class="field"><span>服务</span><select id="speedSource"><option value="npm">国内 npm 镜像 · 下载</option><option value="cloudflare">Cloudflare · 上下行</option><option value="librespeed">LibreSpeed · 自动选点</option><option value="custom">自定义节点</option></select></label>
          <label class="field"><span>下载地址（需支持跨域）</span><input class="mono" id="downloadUrl" readonly/></label>
          <label class="field" id="uploadField" hidden><span>上传地址（POST，需支持跨域）</span><input class="mono" id="uploadUrl" placeholder="https://..."/></label>
          <label class="field"><span>采样次数</span><select id="speedSamples"><option value="1">1 次</option><option value="3" selected>3 次</option></select></label>
          <div class="actions"><button class="primary" id="startSpeed">开始测速</button><button class="secondary" id="stopSpeed" disabled>停止</button></div>
          <p class="status" id="speedStatus" role="status"></p>
          <p class="help">LibreSpeed 会自动选择可连接节点；节点需允许跨域，测速产生实际流量。</p>
        </section>
        <section class="ops-panel" data-pane="result">
          <h2>测速结果</h2>
          <div class="metrics"><div class="metric"><span>下载</span><strong id="downloadMetric">—</strong><small>Mbps</small></div><div class="metric"><span>上传</span><strong id="uploadMetric">—</strong><small>Mbps</small></div></div>
          <progress class="net-progress" id="speedProgress" value="0" max="100" aria-label="测速进度"></progress>
          <div class="result-list" id="speedLog"><p class="empty">尚未测速</p></div>
          <p class="status" id="speedResultStatus" role="status"></p>
        </section>
      </div>
      <div class="ops-workspace" id="latencyView" hidden>
        <section class="ops-panel" data-pane="input">
          <h2>服务访问延迟</h2>
          <label class="field"><span>服务分类</span><select id="targetGroup"><option value="all">全部</option><option value="cloud">运营商与云服务</option><option value="games">游戏平台与厂商</option><option value="internet">互联网厂商</option></select></label>
          <label class="field"><span>每个目标的请求次数</span><select id="probeSamples"><option value="3">3 次</option><option value="5">5 次</option></select></label>
          <label class="field"><span>添加自定义 HTTPS 地址</span><input id="customTarget" placeholder="https://example.com/favicon.ico" autocomplete="off" maxlength="2048"/></label>
          <div class="actions"><button class="secondary" id="addTarget">添加目标</button></div>
          <div class="actions"><button class="primary" id="startLatency">开始检测</button><button class="secondary" id="stopLatency" disabled>停止</button><button class="text-button" id="exportLatency">导出 CSV</button></div>
          <p class="status" id="latencyStatus" role="status"></p>
          <p class="help">测量 HTTPS 请求耗时，不等同 Ping。跨域失败不代表服务离线。</p>
        </section>
        <section class="ops-panel" data-pane="result">
          <div class="panel-head"><h2>请求耗时</h2><span id="latencyCount"></span></div>
          <div class="result-list" id="latencyTable"><table class="net-table"><thead><tr><th>目标</th><th>中位耗时</th><th>已响应</th><th>状态</th></tr></thead><tbody id="latencyRows"></tbody></table></div>
          <div class="pager" id="latencyPager"><button id="previousTargets" aria-label="上一页">←</button><span id="targetPage"></span><button id="nextTargets" aria-label="下一页">→</button></div>
        </section>
      </div>
    </main>
    <footer class="ops-footer"><span>手动发起 · 可随时停止</span><span>Mbps = 兆比特／秒</span></footer>
  </div>
</body>
</html>
