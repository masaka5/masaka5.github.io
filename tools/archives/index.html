<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="浏览器本地查看、压缩和解压 7z、ZIP、TAR 等压缩包，支持密码与目录提取。"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'none'"><title>压缩工具 · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="archive.css"></head>
<body><div class="archive-shell">
<header class="ops-header"><a class="back-link" href="../../">← 口袋工具箱</a><h1>压缩工具</h1><span class="local">本机处理</span></header>
<main>
<div class="topbar"><button id="open" class="primary">打开压缩包</button><button id="new" class="secondary">新建 / 设置</button><button id="browse" class="secondary" disabled>查看内容</button><label class="password-read"><span>打开密码</span><input id="readPassword" type="password" autocomplete="off" placeholder="有密码时填写" maxlength="256"></label><button id="retry" class="secondary" disabled>重新读取</button><button id="integrity" class="secondary" disabled>校验</button><button id="cancel" class="secondary" hidden>取消操作</button></div>
<div class="workspace">
<aside id="settings" class="settings"><div class="panel-head"><h2>压缩设置</h2><span id="draftCount">待添加 0 项</span></div>
<div class="fields"><label class="field"><span>输出格式</span><select id="format"><option value="7z">7z · 高压缩率</option><option value="zip">ZIP · 常用格式</option><option value="tar">TAR · 仅打包</option><option value="gzip">GZIP · 单文件</option><option value="bzip2">BZIP2 · 单文件</option><option value="xz">XZ · 单文件</option></select></label><label class="field"><span>压缩级别</span><select id="level"><option value="1">快速</option><option value="5" selected>标准</option><option value="9">最高</option><option value="0">不压缩</option></select></label><label class="field filename"><span>文件名</span><input id="filename" value="新建压缩包.7z" maxlength="120" autocomplete="off"></label><label class="field password-output"><span>输出密码 · 留空不加密</span><input id="newPassword" type="password" autocomplete="new-password" placeholder="7z / ZIP 支持密码" maxlength="256"></label></div>
<div class="actions"><button id="add" class="secondary">添加文件</button><button id="addFolder" class="secondary">添加目录</button><button id="clearDraft" class="text-button">清空待添加</button></div>
<ul id="draft" class="draft"><li class="draft-empty">添加文件后创建压缩包。<br>打开已有压缩包后，也可以添加或删除再重打包。</li></ul>
<div class="create-actions"><button id="create" class="primary">生成压缩包</button><button id="repack" class="secondary" disabled>重打包</button><a id="download" class="primary" hidden download>下载结果</a></div>
<p class="help">每次最多 256 MiB / 10000 项</p>
</aside>
<section class="browser"><div class="panel-head"><h2 id="archiveName">压缩包内容</h2><span id="summary">尚未打开</span></div><div class="browser-actions"><button id="up" class="secondary" disabled>↑ 上一级</button><span id="breadcrumb" class="breadcrumb">根目录</span><button id="delete" class="text-button" disabled>标记删除</button><button id="undo" class="text-button" disabled>恢复删除</button></div>
<div class="search-row"><input id="search" type="search" placeholder="筛选当前目录文件" aria-label="筛选当前目录文件"><select id="sort" aria-label="排序"><option value="path">名称</option><option value="size">大小</option><option value="packed">压缩大小</option><option value="attributes">属性</option><option value="modified">修改时间</option></select><button id="direction" class="secondary" aria-label="倒序排列">↑</button></div>
<div class="table-scroll"><table><thead><tr><th class="check"><input id="selectAll" type="checkbox" aria-label="选择当前目录全部条目"></th><th>名称</th><th>大小</th><th>压缩大小</th><th>属性</th><th>修改时间</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">打开压缩包查看内容<br><small>拖入一个压缩包即可开始，文件不会上传。</small></div></div>
<div class="extract-actions"><span id="selection">已选择 0 项</span><button id="extract" class="secondary" disabled>下载单文件</button><button id="extractZip" class="primary" disabled>提取为 ZIP</button><button id="saveFolder" class="secondary" disabled>保存到目录</button></div>
</section></div>
<div class="statusbar"><progress id="progress" hidden aria-label="正在处理"></progress><p id="status" class="status" role="status" aria-live="polite">就绪。打开压缩包，或添加文件创建新的压缩包。</p></div>
</main><footer class="ops-footer"><span>文件留在本机</span></footer></div>
<input id="archiveFile" type="file" hidden><input id="addFiles" type="file" multiple hidden><input id="addDirectory" type="file" multiple webkitdirectory hidden><script type="module" src="archive-ui.mjs"></script></body></html>
