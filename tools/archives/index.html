<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><meta name="description" content="浏览器本地查看、压缩和解压 7Z、ZIP、TAR 等压缩包，支持密码、目录提取与重打包。"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'none'"><title>压缩工具 · 工具箱</title><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/ops.css"><link rel="stylesheet" href="/assets/reference-tool-theme.css?v=20261116c"><link rel="stylesheet" href="archive.css?v=20261119-modern8"><script defer src="../../assets/tool-icon-paths.js"></script><script defer src="../../assets/tool-icons.js"></script><script defer src="/assets/reference-tool-shell.js?v=20261116c"></script></head>
<body><div class="archive-shell">
<header class="ops-header archive-header reference-tool-header-with-back"><div class="archive-title"><span class="archive-symbol" aria-hidden="true"><i data-icon="archive"></i></span><div><h1>压缩工具</h1><p>7z · ZIP · TAR</p></div></div><span class="local"><i data-icon="shield-check"></i>本地处理</span></header>
<main>
 <div class="topbar">
  <div class="command-primary"><button id="open" class="primary"><i data-icon="folder-open"></i><span>打开</span></button><div class="mode-switch" role="group" aria-label="压缩工具模式"><button id="new" class="secondary" aria-pressed="false"><i data-icon="file-plus-2"></i><span>创建</span></button><button id="browse" class="secondary" aria-pressed="true" disabled><i data-icon="archive"></i><span>浏览</span></button></div></div>
  <label class="password-read"><i data-icon="key-round"></i><span>密码</span><input id="readPassword" type="password" autocomplete="off" placeholder="可选" maxlength="256"></label>
  <div class="toolbar-utilities"><button id="retry" class="secondary" disabled title="重新读取"><i data-icon="rotate-cw"></i><span>重读</span></button><button id="integrity" class="secondary" disabled title="校验压缩包"><i data-icon="shield-check"></i><span>校验</span></button><button id="cancel" class="secondary" hidden>取消</button></div>
 </div>
 <div class="workspace">
  <aside id="settings" class="settings"><div class="panel-head"><div><span class="section-kicker">新建</span><h2>压缩设置</h2></div><span id="draftCount">0 项</span></div>
   <div class="fields"><label class="field"><span>格式</span><select id="format"><option value="7z">7Z</option><option value="zip">ZIP</option><option value="tar">TAR</option><option value="gzip">GZIP</option><option value="bzip2">BZIP2</option><option value="xz">XZ</option></select></label><label class="field"><span>级别</span><select id="level"><option value="1">快速</option><option value="5" selected>标准</option><option value="9">最高</option><option value="0">不压缩</option></select></label><label class="field filename"><span>文件名</span><input id="filename" value="新建压缩包.7z" maxlength="120" autocomplete="off"></label><label class="field password-output"><span>密码</span><input id="newPassword" type="password" autocomplete="new-password" placeholder="可选，支持 7Z / ZIP" maxlength="256"></label></div>
   <div class="actions"><button id="add" class="secondary"><i data-icon="file-plus-2"></i><span>文件</span></button><button id="addFolder" class="secondary"><i data-icon="folder-open"></i><span>目录</span></button><button id="clearDraft" class="text-button">清空</button></div>
   <ul id="draft" class="draft"><li class="draft-empty"><strong>添加文件开始</strong><span>也可打开现有压缩包后重打包</span></li></ul>
   <p class="help">上限 256 MiB · 10000 项</p>
   <div class="create-actions"><button id="create" class="primary"><i data-icon="archive"></i><span>生成</span></button><button id="repack" class="secondary" disabled>重打包</button><a id="download" class="primary" hidden download><i data-icon="download"></i><span>下载</span></a></div>
  </aside>
  <section class="browser"><div class="panel-head"><div class="browser-title"><span class="section-kicker">工作区</span><h2 id="archiveName">压缩包内容</h2></div><span id="summary">尚未打开</span></div>
   <div class="browser-actions"><button id="up" class="secondary" disabled aria-label="上一级"><i data-icon="arrow-up"></i><span>上一级</span></button><span id="breadcrumb" class="breadcrumb">根目录</span><button id="delete" class="text-button" disabled>删除</button><button id="undo" class="text-button" disabled>恢复</button></div>
   <div class="search-row"><label class="search-box"><i data-icon="search"></i><input id="search" type="search" placeholder="搜索当前目录" aria-label="筛选当前目录文件"></label><select id="sort" aria-label="排序"><option value="path">名称</option><option value="size">大小</option><option value="packed">压缩大小</option><option value="attributes">属性</option><option value="modified">修改时间</option></select><button id="direction" class="secondary" aria-label="倒序排列" title="切换排序方向"><i data-icon="arrow-down-up"></i></button></div>
   <div class="table-scroll"><table><thead><tr><th class="check"><input id="selectAll" type="checkbox" aria-label="选择当前目录全部条目"></th><th>名称</th><th>大小</th><th>压缩后</th><th>属性</th><th>修改时间</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty"><span class="empty-icon" aria-hidden="true"><i data-icon="archive"></i></span><strong>拖入压缩包</strong><small>或点击上方“打开压缩包”</small></div></div>
   <div class="extract-actions"><span id="selection">已选择 0 项</span><button id="extract" class="secondary" disabled><i data-icon="file-down"></i><span>下载文件</span></button><button id="extractZip" class="primary" disabled><i data-icon="archive"></i><span>提取 ZIP</span></button><button id="saveFolder" class="secondary" disabled><i data-icon="folder-open"></i><span>保存到目录</span></button></div>
  </section>
 </div>
 <div class="statusbar"><progress id="progress" hidden aria-label="正在处理"></progress><p id="status" class="status" role="status" aria-live="polite">就绪</p></div>
</main>
</div>
<input id="archiveFile" type="file" hidden><input id="addFiles" type="file" multiple hidden><input id="addDirectory" type="file" multiple webkitdirectory hidden><script type="module" src="archive-ui.mjs?v=20261118-archiveui1"></script></body></html>
